<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>APEX — train your mind & body</title>
<meta name="description" content="APEX — smart-reading microlearning. Swipe bite-sized ideas, take quizzes, explore knowledge maps, tap through stories, train with timers & breathing, and follow YouTube & Instagram workout creators.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APEX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="APEX — train your mind & body">
<meta property="og:description" content="Ideas, quizzes, knowledge maps, stories & workout videos. Smart reading, TikTok-style.">
<meta property="og:type" content="website">
<meta property="og:image" content="/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="APEX — train your mind & body">
<meta name="twitter:description" content="Ideas, quizzes, knowledge maps, stories & workout videos. Smart reading, TikTok-style.">
<meta name="twitter:image" content="/og-image.png">
<!-- Cloudflare Web Analytics (free, cookieless). Enable it: Cloudflare dashboard →
     Analytics & Logs → Web Analytics → add your site → copy the token, then uncomment: -->
<!-- <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "YOUR_TOKEN_HERE"}'></script> -->
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d089"/><stop offset="1" stop-color="#c98f3a"/></linearGradient></defs></svg>

<div class="app" id="app">
  <div class="views" id="views">
    <section class="view active" id="v-home"></section>
    <section class="view nopad" id="v-learn"><div class="feed" id="feed"></div><button class="filtfab" id="filtFab" aria-label="Filter feed"><svg viewBox="0 0 24 24"><path d="M3 5h18v2l-7 7v5l-4 2v-7L3 7z"/></svg></button></section>
    <section class="view" id="v-train"></section>
    <section class="view" id="v-watch"></section>
    <section class="view" id="v-you"></section>
    <div class="reader" id="reader"></div>
  </div>

  <div class="musicbar" id="musicbar">
    <div class="mvis"><i></i><i></i><i></i><i></i></div>
    <div class="minfo"><div class="mt" id="mTitle">Cinematic score</div><div class="ms" id="mSub">Tap play for atmosphere</div></div>
    <div class="mood" id="mMood"><button data-mood="calm">Calm</button><button data-mood="focus" class="on">Focus</button><button data-mood="epic">Epic</button></div>
    <button class="mpp" id="mPP" aria-label="Play music"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>

  <nav class="tabbar">
    <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-2v9h-5v-6h-4v6H5v-9H3z"/></svg><span>Home</span></button>
    <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><span>Learn</span></button>
    <button class="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M20.5 9.5h-1V7a1 1 0 0 0-2 0v2.5h-11V7a1 1 0 0 0-2 0v2.5h-1a1 1 0 0 0 0 2h1V14a1 1 0 0 0 2 0v-2.5h11V14a1 1 0 0 0 2 0v-2.5h1a1 1 0 0 0 0-2z"/></svg><span>Train</span></button>
    <button class="tab" data-tab="watch"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm6 4v8l6-4z"/></svg><span>Watch</span></button>
    <button class="tab" data-tab="you"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg><span>You</span></button>
  </nav>

  <div class="toasts" id="toasts"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="cmtSheet"><div class="grab"></div><h3><span id="cmtCount">0 comments</span><span class="close" data-close>✕</span></h3><div class="comments" id="commentsList"></div><div class="composer"><div class="me">Y</div><input id="cmtInput" placeholder="Add your reflection…" maxlength="220" autocomplete="off"><button class="send" id="cmtSend" aria-label="Post"><svg viewBox="0 0 24 24"><path d="M3 20.5v-6l9-2.5-9-2.5v-6l19 8.5z"/></svg></button></div></div>
  <div class="timer" id="timer"></div>
  <div class="stories" id="stories"></div>
  <div class="quiz" id="quiz"></div>
  <div class="mapview" id="mapview"></div>
  <div class="filtsheet" id="filtSheet"><div class="grab"></div><h3><span>Filter the feed</span><span class="close" data-closefilt>✕</span></h3><div class="fchips" id="filtChips"></div></div>
  <div class="sharemodal" id="shareModal"><div class="grab"></div><h3><span>📤 Share as image</span><span class="close" id="shClose">✕</span></h3><div class="shprev"><canvas id="shCanvas"></canvas></div><div class="shbtns"><button id="shDownload"><svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Download</button><button class="prim" id="shShare"><svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1C9 12 6 13 3 17c1-6 5-8 11-8z"/></svg>Share</button></div></div>
  <div class="onboard" id="onboard"></div>
  <div class="search" id="search"></div>
  <div class="aisheet" id="aiSheet"></div>
  <div class="filtsheet" id="collSheet"><div class="grab"></div><h3><span>Add to collection</span><span class="close" data-closefilt>✕</span></h3><div class="fchips" id="collChips"></div></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
