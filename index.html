 ["health","idea","Standing up every 30 minutes undoes a lot of sitting's harm.","You don't need a gym to break the damage of a desk. Small, frequent movement beats one heroic workout after 10 sedentary hours."],
 ["health","idea","Chronic stress ages you at the cellular level.","It shortens telomeres, the caps on your DNA. Managing stress isn't soft — it's longevity science."],
 ["health","fact","Laughing really is good medicine.","It lowers stress hormones, relaxes blood vessels and boosts immunity. A good laugh is a tiny, free workout for your insides."],
 ["money","idea","Beware anchoring on the first number.","Whatever price you see first quietly sets your sense of 'fair.' Sellers know this — decide your own number before you look at theirs."],
 ["money","idea","The best investment is usually boring.","Cheap, broad, automatic, and left alone for decades. Excitement in investing is often just a fee you pay to feel busy."],
 ["money","idea","Insure the catastrophes, self-fund the small stuff.","Insurance is for what would ruin you, not minor bills. Buying coverage for tiny risks just pays someone else's profit margin."],
 ["life","idea","Discomfort is the toll for a bigger life.","Growth lives just past the edge of easy. If nothing ever feels hard, your world has quietly stopped expanding."],
 ["life","idea","You have time for what you prioritize.","'I don't have time' usually means 'it's not a priority.' Try saying that version out loud — it clarifies fast."],
 ["life","idea","Reputation is built in the boring moments.","Not the big speeches — the returned calls, the kept small promises, the quiet reliability. Trust compounds like interest."],
 ["life","idea","Nobody is thinking about you as much as you fear.","Everyone stars in their own movie, where you're a minor character. That's not sad — it's freedom to just go do the thing."],
 ["discipline","idea","Motivation gets you started; systems keep you going.","Waiting to feel like it is a losing strategy. Build a default — same time, same place — and let the routine carry you."],
 ["discipline","idea","Make the good choice the easy one.","Willpower is finite; design isn't. Put the fruit in front, hide the chips, lay out the shoes. Win before the moment of temptation."],
 ["discipline","quote","Suffer the pain of discipline or suffer the pain of regret.","Jim Rohn","—"],
 ["learn","idea","Confusion is the sound of learning happening.","That foggy, uncomfortable feeling right before it clicks is your brain rewiring. Don't flee it — that's the whole workout."],
 ["learn","idea","Write it in your own words or you don't own it.","Copying feels like learning and isn't. Rephrasing forces understanding — if you can't reword it, you haven't got it yet."],
 ["mind","idea","Name it to tame it.","Labeling an emotion — 'this is anxiety' — hands the wheel back to your thinking brain and calms the alarm. Feelings you can name, you can face."],
 ["mind","idea","You don't have to attend every argument you're invited to.","Silence is a full sentence. Not every provocation deserves your energy — walking away is a form of winning."],
 ["genius","idea","Steal like an artist.","Nothing is fully original — everything builds on what came before. Remix widely, credit generously, and your voice emerges from the mix."],
 ["genius","idea","Ask better questions, get better answers.","Most breakthroughs are a reframed problem, not a cleverer solution. Spend more time on the question and the answer often reveals itself."],
 ["science","fact","Glass is technically a slow-moving liquid — no, that's a myth.","Old windows are thicker at the bottom because of how they were made, not because glass 'flows.' Glass is a solid. Bust the myth."],
 ["science","fact","Lightning strikes Earth about 8 million times a day.","Roughly 100 bolts every second. The planet is a lot more electric than it feels from the couch."],
 ["science","fact","Your body is slightly taller in the morning.","Overnight, spinal discs decompress and you gain up to a centimetre — which you lose again as the day squishes you back down."],
 ["science","fact","Water can boil and freeze at the same time.","At its 'triple point' — a precise pressure and temperature — water exists as solid, liquid and gas at once. Reality is stranger than school let on."],
 ["fit","idea","Rest is when you actually get stronger.","Training breaks muscle down; recovery builds it back bigger. Skip rest and you're just accumulating fatigue, not fitness."],
 ["fit","idea","Consistency beats intensity every time.","Three easy workouts a week for a year crush one brutal session you quit after. The best plan is the one you'll actually repeat."],
 ["fit","idea","Walking is the most underrated exercise.","Low-impact, joint-friendly, mood-boosting, and sustainable for life. You don't have to suffer to get healthier — just move, often."],

 /* ===== ASTRONOMY ===== */
 ["astro","fact","The Sun holds 99.8% of the entire Solar System.","Every planet, moon, asteroid and comet combined is a rounding error. When you picture the Solar System, you're mostly picturing the Sun.","","Solar_sys8.jpg"],
 ["astro","fact","It takes sunlight 8 minutes and 20 seconds to reach you.","The sunrise you see already happened. If the Sun vanished, you'd enjoy eight more minutes of a star that was already gone."],
 ["astro","fact","There are more stars than grains of sand on Earth.","Hundreds of billions of stars per galaxy, hundreds of billions of galaxies. The sky isn't big — it's beyond big.","","Milky_Way_Arch.jpg"],
 ["astro","fact","A day on Venus is longer than its year.","Venus spins so slowly that it laps the Sun before it finishes a single rotation. And it spins backwards."],
 ["astro","fact","Saturn would float in water.","It's a giant ball of gas less dense than water. Find a bathtub big enough and the ringed planet would bob like a cork.","","Saturn_during_Equinox.jpg"],
 ["astro","fact","Neutron stars spin up to 700 times a second.","A city-sized corpse of a dead star, so dense a sugar-cube of it weighs a billion tons, whirling faster than a kitchen blender."],
 ["astro","idea","We are made of dead stars.","The calcium in your bones, the iron in your blood, the oxygen you breathe — all forged inside stars that exploded billions of years ago. You are, literally, stardust with opinions."],
 ["astro","fact","There's a giant storm on Jupiter older than the telescope.","The Great Red Spot is a hurricane wider than Earth that's been raging for at least 350 years.","","Jupiter_and_its_shrunken_Great_Red_Spot.jpg"],
 ["astro","fact","In space, nobody can hear you scream — it's true.","Sound needs a medium to travel through. The vacuum of space is silent no matter how loud the explosion."],
 ["astro","fact","Light from the Andromeda galaxy is 2.5 million years old.","When it left, our ancestors hadn't yet learned to make fire. You can see it with the naked eye — a window 2.5 million years into the past."],
 ["astro","quote","Somewhere, something incredible is waiting to be known.","Carl Sagan","astronomer"],
 ["astro","fact","The Moon is drifting away from us.","About 3.8 cm per year — the width of a fingernail's growth. One day, far in the future, total solar eclipses will no longer happen."],

 /* ===== PHYSICS ===== */
 ["physics","idea","Time runs slower for your feet than your head.","Gravity warps time. Clocks closer to Earth tick slightly slower. Live upstairs and you age a hair faster than someone on the ground floor — measurably."],
 ["physics","fact","Nothing can move faster than light — and it's a law, not a limit.","At light speed, time stops and mass becomes infinite. The universe has a speed limit, and it's built into the fabric of reality itself."],
 ["physics","idea","You can never touch anything.","The electrons in your hand repel the electrons in this screen. What you feel as 'touch' is force fields resisting — you hover a fraction of an atom above everything."],
 ["physics","fact","A single quantum particle can be in two places at once.","Until you measure it. Reality at the smallest scale isn't solid — it's a cloud of probabilities that only picks a spot when observed."],
 ["physics","quote","If you think you understand quantum mechanics, you don't understand quantum mechanics.","Richard Feynman","physicist","","Albert_Einstein_Head.jpg"],
 ["physics","idea","Heat is just things jiggling.","Temperature is the average speed of vibrating atoms. 'Cold' is slow jiggling; absolute zero is when the jiggling almost stops entirely."],
 ["physics","fact","Entropy is why time has a direction.","Eggs break but never un-break. The universe always trends from order to disorder, and that one-way slide is the closest thing to time's arrow."],
 ["physics","idea","Every object with mass bends space around it.","Planets don't orbit because of a string — they roll along the curves that mass carves into spacetime, like marbles on a stretched sheet."],

 /* ===== MATH ===== */
 ["math","idea","The Mandelbrot set: infinite complexity from one tiny formula.","Zoom in forever and new worlds keep unfolding, never repeating. All of it born from z = z² + c. Simplicity can hide infinity.","","Mandel_zoom_00_mandelbrot_set.jpg"],
 ["math","fact","The golden ratio hides in sunflowers, shells and galaxies.","1.618… shows up wherever nature packs things efficiently. Beauty and math are quietly the same subject.","","Fibonacci_spiral_34.svg"],
 ["math","idea","There are different sizes of infinity.","The infinity of whole numbers is smaller than the infinity of decimals between 0 and 1. Some infinities are literally bigger than others — Cantor proved it."],
 ["math","fact","23 people give a better-than-even chance two share a birthday.","The 'birthday paradox.' Because you're comparing every pair, the odds explode faster than intuition expects. Math laughs at your gut feeling."],
 ["math","idea","Zero was a radical, dangerous idea.","For millennia, civilizations had no symbol for 'nothing.' Inventing zero unlocked algebra, calculus, and eventually every computer you've ever touched."],
 ["math","fact","A piece of paper folded 42 times would reach the Moon.","Doubling is deceptively violent. 42 folds = 4 trillion times thicker. You can't actually fold it past ~7, but the math is real."],
 ["math","idea","Statistics can be true and still lie.","A hospital with a higher death rate might treat the sickest patients. Numbers without context are a magician's favourite tool. Always ask what's hidden."],
 ["math","quote","Pure mathematics is, in its way, the poetry of logical ideas.","Albert Einstein","physicist"],
 ["math","fact","π has never repeated and never will.","Its digits go on forever with no pattern. Somewhere in π, in principle, sits your birthday, your name, and this sentence — encoded in numbers."],
 ["math","idea","Prime numbers are the atoms of arithmetic.","Every number is built from primes multiplied together, in exactly one way. They thin out forever but never run out — and they guard your online banking."],

 /* ===== ANATOMY ===== */
 ["anatomy","fact","Your heart beats about 100,000 times a day.","Around 2.5 billion beats in a lifetime, never taking a break, pumping blood through 100,000 km of vessels — enough to wrap Earth twice.","","Heart_diagram-en.svg"],
 ["anatomy","fact","Your brain runs on about 20 watts.","Less power than a dim lightbulb, yet it out-thinks supercomputers that need a building's worth of electricity. The most efficient machine known.","","Human_brain_NIH.jpg"],
 ["anatomy","fact","You have a second 'brain' in your gut.","500 million neurons line your digestive tract, making and using the same chemicals as your head. That 'gut feeling' has real hardware.","","Human_brain_NIH.jpg"],
 ["anatomy","fact","Your lungs have the surface area of a tennis court.","Folded into millions of tiny sacs, all that surface lets you swap oxygen for carbon dioxide with every breath, ~20,000 times a day.","","1801_The_Lungs_and_Pulmonary_System.jpg"],
 ["anatomy","fact","Bone is stronger than steel by weight.","Your skeleton is a living, self-repairing scaffold — lighter than metal, tougher than concrete, and it rebuilds itself entirely every decade.","","Skeleton_diagram.svg"],
 ["anatomy","fact","Your stomach acid could dissolve metal.","It's strong enough to burn skin, yet your stomach relines itself every few days so it doesn't digest itself. Biology's safety engineering is ruthless."],
 ["anatomy","fact","You make about 1.5 litres of saliva a day.","Enough to fill a large bottle. It starts digestion, protects your teeth, and lets you taste — a fluid you never think about until it stops."],
 ["anatomy","fact","Nerve signals travel up to 120 metres per second.","Faster than a race car. Touch a hot stove and the 'pull back' command reaches your muscles before the pain even reaches your brain."],
 ["anatomy","idea","Your body replaces its skin every month.","You shed about 40,000 dead skin cells a minute. Much of the dust in your home is, quietly, former you."],
 ["anatomy","fact","The eye can distinguish about 10 million colours.","Three types of cone cells mix signals into a spectrum richer than any screen. And your brain quietly edits out your own blind spot so you never notice it."],

 /* ===== BIOLOGY ===== */
 ["bio","fact","There are more bacterial cells on you than human cells.","You're walking an ecosystem. Trillions of microbes help you digest, defend, and even shape your mood. 'You' are a democracy, not a monarchy.","","DNA_orbit_animated_static_thumb.png"],
 ["bio","fact","Your DNA would stretch to the Sun and back — many times.","Uncoiled, the DNA in your body would run about 10 billion miles. It's packed into cells you can't even see. Nature is a master of compression."],
 ["bio","idea","Every cell in you carries the whole blueprint.","A skin cell holds the same full genome as a brain cell. They differ only in which pages they read. Identity is about what you switch on, not what you own."],
 ["bio","fact","Trees talk through underground fungal networks.","Roots and fungi form a 'wood wide web,' trading sugar and warnings between trees. The quiet forest is actually a busy marketplace.","","Chloroplast.svg"],
 ["bio","fact","Some jellyfish are effectively immortal.","One species can revert to its baby stage and start over, dodging old age indefinitely. Death, it turns out, isn't mandatory for everyone."],
 ["bio","idea","Evolution has no goal — only what survives.","There's no ladder toward 'better.' Whatever reproduces, continues. Every living thing is just the current draft of a 4-billion-year experiment."],

 /* ===== HISTORY + TIMELINES ===== */
 ["history","timeline","Rome: from village to empire to ruin, in 4 acts.","753 BC a village on seven hills → 509 BC the Republic → 27 BC Augustus crowns the Empire → 476 AD the West falls. Twelve centuries, one long arc of rise and overreach.","","Colosseum_in_Rome,_Italy_-_April_2007.jpg"],
 ["history","timeline","The 20th century in one breath.","1914 WWI → 1939 WWII → 1945 the atom & the UN → 1969 the Moon → 1989 the Wall falls → 1991 the web. Two generations rewrote the whole world.","","Berlin_Wall_1961-11-20.jpg"],
 ["history","fact","Cleopatra lived closer to the iPhone than to the Pyramids.","The Great Pyramid was already ~2,500 years old in her day. The Moon landing is closer to her reign than she was to the pharaohs who built Giza.","","All_Gizah_Pyramids.jpg"],
 ["history","fact","The Great Wall wasn't one wall — or fully successful.","Built over 2,000 years by many dynasties, it was breached repeatedly. Its real strength was slowing raids and moving troops, not being unbreakable.","","Great_Wall_of_China_at_Jinshanling-edit.jpg"],
 ["history","idea","Empires die from the inside first.","Rome, the Ottomans, the USSR — the cracks were fiscal and political long before any enemy arrived. Watch the accounts and the trust, not just the borders."],
 ["history","fact","Oxford University is older than the Aztec Empire.","Teaching began at Oxford around 1096. The Aztecs founded Tenochtitlán in 1325. 'Ancient' and 'medieval' overlap in ways school never mentioned."],
 ["history","timeline","How writing changed everything.","~3200 BC Sumerian cuneiform → ~1200 BC alphabets → 1440 the printing press → 1990s the internet. Each leap made memory cheaper and ideas faster.","","Cassini_Map_of_France.jpg"],
 ["history","fact","The Library of Alexandria didn't burn in one night.","It declined over centuries — funding cuts, neglect, scattered fires. The great loss of knowledge was slow bleeding, not a single blaze. Institutions rot quietly."],
 ["history","quote","Those who cannot remember the past are condemned to repeat it.","George Santayana","philosopher"],
 ["history","fact","Genghis Khan may have shaped the modern gene pool.","Roughly 1 in 200 men alive today may descend from his lineage. Few individuals have bent history — and demographics — so hard.","","Napoleon4.jpg"],
 ["history","idea","Most 'sudden' revolutions were decades in the making.","The pressure builds invisibly — debt, injustice, new ideas — then one spark makes it look instant. The match gets the credit the kindling deserves."],
 ["history","fact","The Black Death reshaped the modern world.","Killing a third of Europe, it shattered feudalism, raised the value of labour, and helped seed the Renaissance. Catastrophe and reinvention often travel together."],
 ["history","timeline","The birth of Israel, in dates.","1917 the Balfour Declaration → 1947 the UN partition plan → 14 May 1948 independence declared → 1949 armistice lines. A modern state born under fire, fast.","","Equirectangular_projection_SW.jpg"],
 ["history","fact","Ancient Egypt lasted longer than the time since it ended.","The civilization ran ~3,000 years — longer than the ~2,000 years between Cleopatra and today. Some things really were built to last."],

 /* ===== STRATEGY / MILITARY / IDF ===== */
 ["war","strategy","Sun Tzu: win before the battle begins.","The supreme art of war is to subdue the enemy without fighting. Position, timing and information decide most conflicts long before swords are drawn.","","Sun_Tzu.jpg"],
 ["war","strategy","Maneuver beats attrition.","Don't grind into the enemy's strength — dislocate it. Hit where they're weak, move faster than they can react, and make their plan irrelevant rather than merely costly.","","Israel_Defense_Forces_-_Merkava_Mark_IV_(2).jpg"],
 ["war","strategy","Combined arms: no single weapon wins alone.","Infantry, armour, artillery and air each cover the others' weakness. Tanks without infantry get ambushed; infantry without cover gets pinned. Strength is in the mix.","","Israel_Defense_Forces_-_Merkava_Mark_IV_(2).jpg"],
 ["war","strategy","A small nation's doctrine: defensive depth, offensive tempo.","Lacking land to trade for time, Israel's General Staff (המטכ״ל) built a doctrine of fast reserve mobilization, seizing initiative early, and moving the fight onto enemy ground.","","Israel_Defense_Forces_-_Merkava_Mark_IV_(2).jpg"],
 ["war","strategy","1967: the value of the first move.","In six days, a pre-emptive strike neutralized enemy air power on the ground, then armour exploited the opening. It became a textbook case of initiative and combined arms.","","Equirectangular_projection_SW.jpg"],
 ["war","strategy","1973 taught the cost of surprise.","Caught off guard on Yom Kippur, early losses were reversed only by rapid mobilization and hard counterattacks. Lesson etched into doctrine: never be surprised again; keep reserves ready."],
 ["war","strategy","Logistics wins wars quietly.","Amateurs talk tactics; professionals study supply. Fuel, ammunition and spare parts decide how far and how long any army can actually fight. The boring stuff is decisive."],
 ["war","strategy","The OODA loop: out-think, then out-fight.","Observe, Orient, Decide, Act — faster than your opponent. Whoever cycles through decisions quicker forces the other to react, and reacting armies lose the initiative."],
 ["war","strategy","Mission command: tell people the goal, not every step.","Give commanders intent and let them adapt on the ground. Rigid orders shatter on contact; trained initiative bends and holds. Trust scales faster than micromanagement."],
 ["war","quote","In preparing for battle, plans are useless, but planning is indispensable.","Dwight D. Eisenhower","general & president"],
 ["war","strategy","Terrain is a weapon you don't have to carry.","High ground, chokepoints, rivers and cities multiply a defender's strength. Reading the map is half of reading the fight.","","Hannibal_route_of_invasion-en.svg"],
 ["war","strategy","Deterrence is winning the war you never fight.","If the cost you can impose looks higher than any prize, rational enemies stay home. The strongest victories leave no craters."],

 /* ===== MAPS / GEOGRAPHY ===== */
 ["maps","map","Every flat map lies — pick your distortion.","You can't peel a sphere onto paper without stretching something. Mercator keeps directions but bloats the poles; equal-area keeps sizes but bends shapes.","","Mercator_projection_SW.jpg"],
 ["maps","map","Africa is bigger than it looks — much bigger.","On common maps it looks similar to Greenland. In reality Africa could swallow the US, China, India and most of Europe combined. The map shrank the equator.","","Equirectangular_projection_SW.jpg"],
 ["maps","fact","The equator crosses 13 countries and two oceans.","A belt of rainforest, island and sea where day and night stay almost equal all year. Geography quietly sets the rhythm of life.","","World_map_-_low_resolution.svg"],
 ["maps","map","Rivers built the first civilizations.","Nile, Tigris–Euphrates, Indus, Yellow River — cities rose where water made farming reliable. Follow the rivers and you find where history began.","","Cassini_Map_of_France.jpg"],
 ["maps","fact","There's a point in the ocean farthest from any land.","Point Nemo, in the South Pacific, is so remote the nearest humans are often astronauts overhead on the space station. The empty places are enormous."],
 ["maps","map","Chokepoints control the world's trade.","Suez, Panama, Hormuz, Malacca — narrow straits where a single blockage ripples through every economy. Whoever controls the neck controls the flow.","","Equirectangular_projection_SW.jpg"],
 ["maps","idea","Borders are younger than they look.","Most national lines on today's map were drawn in the last 150 years, many with a ruler and little regard for the people underneath. Maps are frozen politics."],
 ["geo","fact","Mount Everest isn't the tallest mountain — depending how you measure.","From base to peak, Hawaii's Mauna Kea beats it. From Earth's centre, Ecuador's Chimborazo wins. 'Tallest' depends entirely on where you start counting."],
 ["geo","fact","Russia spans 11 time zones.","When it's morning on one edge it's evening on the other. A single country so wide the Sun can't light all of it at once."],
 ["geo","fact","The Sahara was green just a few thousand years ago.","Lakes, grassland and hippos covered what's now the world's largest hot desert. Climate flips whole continents on timescales shorter than you'd think."],

 /* ===== LONG STORIES ===== */
 ["story","story","The two monks and the woman at the river.","Two monks meet a woman unable to cross a muddy river. The elder lifts her over, then walks on. Hours later the younger bursts out: 'We're forbidden to touch women — how could you?' The elder smiles: 'I set her down at the river. Why are you still carrying her?' We suffer most from what we refuse to put down."],
 ["story","story","The farmer whose luck no one could judge.","A farmer's horse runs away. 'Bad luck,' say the neighbours. 'Maybe,' he replies. The horse returns with wild horses. 'Good luck!' 'Maybe.' His son breaks a leg taming one. 'Bad luck.' 'Maybe.' Soldiers come to draft the young men but pass over the injured son. Every event was a seed whose fruit no one could yet see. Judge less; wait more."],
 ["story","story","The king who wanted the truth in one sentence.","A king asked his wisest advisors for a truth that held in good times and bad. They labored for years and returned with a ring engraved: 'This too shall pass.' In grief it comforted him; in triumph it humbled him. Nothing is permanent — which is exactly why nothing is worth despair, and everything is worth savouring."],
 ["story","story","The professor, the jar and the rocks.","A teacher fills a jar with big rocks and asks, 'Full?' 'Yes.' He adds pebbles, then sand, then water — each time it fits. 'The lesson isn't that you can always fit more,' he says. 'It's that if you don't put the big rocks in first, they'll never fit at all.' Schedule what matters before the trivia fills your life."],
 ["story","story","The apprentice who was told to make 100 pots.","Half a pottery class was graded on the single best pot; the other half on sheer quantity. At the end, the finest pots came from the quantity group. While the perfectionists theorized, the makers learned by failing fast, again and again. You don't think your way to mastery. You rep your way there."],
 ["story","story","The Zen master's overflowing cup.","A scholar visited a master to learn, but kept interrupting with his own opinions. The master poured tea until the cup overflowed onto the table. 'Stop — it's full!' cried the scholar. 'Like this cup,' said the master, 'you are full of your own ideas. How can I show you anything until you empty your cup?' You can't learn what you think you already know."],

 /* ========= BATCH 2: much longer feed across every subject ========= */
 /* -- Discipline -- */
 ["discipline","idea","Motivation gets you started; systems keep you going.","The pros don't rely on feeling inspired. They build a routine so simple it runs on autopilot, then let momentum do the heavy lifting."],
 ["discipline","idea","Discomfort is a skill you can train.","Sit in the cold shower, hold the plank, send the scary email. Each rep raises your tolerance a notch. Toughness is a callus, not a gift."],
 ["discipline","idea","Win the first hour, win the day.","Whatever you do right after waking sets the tone. Guard it: no phone, no news — one deliberate act of discipline before the world gets a vote."],
 ["discipline","idea","Don't break the chain.","Mark an X on the calendar every day you do the thing. Soon the unbroken streak itself becomes the motivation. Protect the chain."],
 ["discipline","quote","We are what we repeatedly do. Excellence, then, is not an act but a habit.","Will Durant (on Aristotle)","The Story of Philosophy"],
 ["discipline","idea","The dip is where most people quit — and where the reward lives.","Every worthwhile pursuit has a valley of boredom and doubt. It exists precisely to filter out the uncommitted. Push through and the field thins."],
 ["discipline","idea","Lower the bar to keep the streak.","Too tired for the full workout? Do one push-up. The goal isn't the rep — it's never letting yourself become a person who skips."],
 /* -- Mindfulness -- */
 ["mind","idea","Your attention is your life.","Where it goes, your experience follows. Whoever controls your attention controls your reality — make sure it's you, not an algorithm."],
 ["mind","idea","Anxiety is excitement without breath.","Same racing heart, same energy. Slow, long exhales tell your body the story has changed from threat to challenge."],
 ["mind","quote","Wherever you are, be there totally.","Eckhart Tolle","The Power of Now"],
 ["mind","idea","The urge always passes if you surf it.","Cravings peak and fall like waves in a few minutes. You don't have to fight them — just watch, breathe, and let the wave break."],
 ["mind","idea","Do one thing at a time, on purpose.","Multitasking is just switching quickly and paying a tax each time. Single-tasking is the quiet superpower of a fractured age."],
 ["mind","idea","Notice three breaths before you react.","A tiny pause is enough to move the decision from your reflexes to your reason. Three breaths can save a relationship."],
 /* -- Learning -- */
 ["learn","idea","If you can't explain it simply, you don't understand it.","The Feynman test. Teaching a concept in plain words exposes every gap you were hiding — from yourself most of all."],
 ["learn","idea","Difficulty is the feeling of learning.","When study feels smooth, you're usually just reviewing. When it feels effortful, that friction is the memory being carved. Chase the struggle."],
 ["learn","idea","Sleep is the second half of studying.","Your brain replays and files the day's learning overnight. Pull an all-nighter and you erase much of what you just paid for."],
 ["learn","idea","Interleave, don't block.","Mixing problem types feels messier but trains you to pick the right tool, not just repeat the last one. Real life never comes pre-sorted."],
 ["learn","quote","Live as if you were to die tomorrow. Learn as if you were to live forever.","Mahatma Gandhi","—"],
 ["learn","idea","A note you'll never reread is wasted ink.","Learning isn't collecting information; it's building recall. Test yourself on the notes, or don't bother taking them."],
 /* -- Life -- */
 ["life","idea","You become your defaults.","Willpower is rare; defaults run your life. Change what's easiest to reach — the snack, the app, the route — and you change who you are."],
 ["life","idea","Most things are a five-minute task you've turned into a five-day dread.","Reply, book it, send it. The doing is usually smaller than the avoiding. Clear the small stuff and reclaim the headspace."],
 ["life","quote","The two most important days in your life are the day you are born and the day you find out why.","Mark Twain (attrib.)","—"],
 ["life","idea","Compare down before you compare up.","The instinct is to measure against those ahead. Occasionally look back at how far you've come — same data, opposite mood."],
 ["life","idea","Say the kind thing out loud.","The compliment you think but don't say helps no one. Voiced appreciation is free to give and expensive to withhold."],
 ["life","idea","Energy management beats time management.","You don't have more hours to find — you have better hours to protect. Match your hardest work to your sharpest window."],
 ["life","idea","Boundaries are how you teach people to treat you.","Every 'yes' you resent is a boundary you skipped. A clear no now prevents a bitter one later."],
 /* -- Genius / thinking -- */
 ["genius","idea","First principles: build up from what must be true.","Stop reasoning by analogy ('this is like that'). Strip a problem to its physics and rebuild. It's how you get answers no one copied."],
 ["genius","idea","Strong opinions, loosely held.","Commit hard enough to act, but stay ready to be wrong. Certainty feels good and blinds you; curiosity feels uneasy and keeps you sharp."],
 ["genius","idea","Map the second-order effects.","Everyone sees the immediate result. The edge is asking 'and then what?' — the ripple after the splash is where the real consequences live."],
 ["genius","quote","It is the mark of an educated mind to entertain a thought without accepting it.","Aristotle","—"],
 ["genius","idea","Name your assumptions, then attack them.","Every plan rests on hidden beliefs. Write them down and ask which one, if wrong, breaks everything. Defend that one first."],
 ["genius","idea","Simplicity is the final achievement, not the starting point.","Anyone can make it complicated. It takes deep understanding to make it simple. Clarity is compressed mastery."],
 /* -- Psychology -- */
 ["psych","fact","You remember the peak and the end, not the average.","The 'peak-end rule': experiences are judged by their most intense moment and how they finished. Design endings on purpose."],
 ["psych","idea","Loss hurts about twice as much as the equal gain feels good.","Loss aversion quietly runs your decisions. Knowing it lets you see when fear of losing is outvoting a sensible risk."],
 ["psych","fact","Your brain invents reasons after you've already decided.","Much of 'reasoning' is a press secretary justifying a choice your gut made first. Humility about your own motives is a superpower."],
 ["psych","idea","What you focus on expands.","Scan for threats and the world looks dangerous; scan for good and it looks generous. Attention is a spotlight that paints the whole room."],
 ["psych","fact","Merely naming a feeling calms the brain's alarm.","Brain scans show that labeling an emotion — 'this is anxiety' — shifts activity to the reasoning centre. Name it to tame it."],
 ["psych","idea","The Zeigarnik effect: unfinished tasks haunt you.","Your mind clings to open loops. Write the task down and the nagging often stops — the brain trusts the paper to remember."],
 /* -- Money -- */
 ["money","finance","Compound interest is the eighth wonder — and it's boring on purpose.","Nothing seems to happen for years, then everything happens at once. The fortune hides in the final stretch. Start early, wait long."],
 ["money","idea","Rich is a income; wealthy is options.","Rich is the car and the watch. Wealthy is not needing the job. Aim for assets that pay you, not stuff that bills you."],
 ["money","finance","The market rewards patience and taxes panic.","The biggest gains often come in a handful of days you can't predict. Miss them by trying to time the market and returns collapse."],
 ["money","idea","Pay yourself first.","Automate savings the day you're paid, before lifestyle eats it. Willpower fails; a standing transfer doesn't."],
 ["money","idea","Every purchase has a price and a cost.","The price is the money. The cost is everything that money could have become. Wealth is the stuff you didn't buy."],
 ["money","quote","Do not save what is left after spending; spend what is left after saving.","Warren Buffett","—"],
 /* -- Philosophy -- */
 ["phil","idea","Memento mori — remember you will die.","Not morbid — clarifying. A finite life makes trivial worries shrink and real priorities glow. Death is the editor of a well-lived day."],
 ["phil","idea","The obstacle is the way.","The thing blocking your path can become the path. Adversity is raw material for the exact virtues you claim to want."],
 ["phil","quote","He who has a why to live can bear almost any how.","Friedrich Nietzsche","—"],
 ["phil","idea","Amor fati: love your fate.","Don't just accept what happens — will it. Treat every event as fuel. The strongest response to reality is to embrace it and act."],
 ["phil","idea","You could leave life right now — let that decide what you do.","Marcus Aurelius' jolt. Not fear, focus. If this could be the last one, which grudges and delays suddenly look absurd?"],
 ["phil","idea","The unexamined life is not worth living.","Socrates chose death over ceasing to question. A life run on autopilot and inherited opinions is barely yours at all."],
 /* -- Science -- */
 ["science","fact","A single bolt of lightning is five times hotter than the Sun's surface.","~30,000°C for a fraction of a second. The flash you barely glimpse is one of the hottest things on Earth."],
 ["science","fact","Honey never spoils.","Archaeologists found 3,000-year-old honey in Egyptian tombs, still edible. Low water and natural acidity make it nearly immortal food."],
 ["science","fact","Hot water can freeze faster than cold — sometimes.","The Mpemba effect, still debated, shows nature doesn't always obey common sense. The world is stranger than intuition allows."],
 ["science","idea","Correlation is not causation — and it fools everyone.","Ice cream sales and drownings rise together (summer causes both). Before you connect two dots, look for the hidden third."],
 ["science","fact","There's enough gold in the ocean to give everyone kilograms of it.","But it's so diluted that extracting it costs more than it's worth. Abundance and access are very different things."],
 ["science","fact","Bananas are radioactive — harmlessly.","They contain potassium-40. You'd need to eat millions at once to be in danger. 'Radioactive' rarely means 'dangerous'."],
 /* -- Health -- */
 ["health","idea","Zone 2: the fitness most people skip.","Easy, conversational cardio builds the aerobic engine that powers everything else. You don't have to suffer to get healthier."],
 ["health","fact","Your gut and brain talk constantly.","The vagus nerve carries more signals up from the gut than down to it. What you eat quietly shapes how you feel."],
 ["health","idea","Sunlight in the morning sets your whole day.","Early light anchors your body clock, sharpening focus by day and sleep by night. Ten minutes outside beats another coffee."],
 ["health","idea","Muscle is the organ of longevity.","Strength training past 40 protects bones, metabolism, and independence. Lifting isn't vanity — it's a retirement plan for your body."],
 ["health","fact","Chronic stress and chronic inflammation are cousins.","Ongoing stress keeps your body in low-grade alarm, which ages you from the inside. Rest isn't lazy — it's maintenance."],
 /* -- Fitness -- */
 ["fit","idea","Progressive overload is the whole secret.","Do a little more over time — a rep, a kilo, a minute. The body adapts only to demands slightly beyond the comfortable."],
 ["fit","idea","You can't out-train a bad diet.","Abs are revealed in the kitchen. Movement builds the engine; food decides what it runs on. Both matter; food usually more."],
 ["fit","idea","Soreness is not the goal — progress is.","Chasing pain is a beginner's error. The point is getting stronger and moving better, not being wrecked the next day."],
 ["fit","idea","The best exercise is the one you'll keep doing.","A 'perfect' plan you quit in three weeks loses to a decent plan you run for years. Pick something you can stand to repeat."],
 /* -- Economy -- */
 ["econ","fact","Inflation is a quiet tax on savings.","When prices rise, money in a low-interest account slowly loses value. Doing 'nothing' with cash isn't safe — it's shrinking."],
 ["econ","idea","Incentives explain almost everything.","Want to predict behaviour? Ask what people are rewarded for. Systems don't run on good intentions — they run on incentives."],
 ["econ","fact","Comparative advantage: trade helps even the 'worse' side.","Even if one country is better at everything, both gain by specializing in what they're relatively best at. Cooperation beats self-sufficiency."],
 ["econ","idea","There's no such thing as a free lunch.","Every choice has a cost, even when it looks free. The question is never 'is it free?' but 'what am I giving up?'"],
 ["econ","fact","Most money isn't printed — it's created by loans.","When a bank lends, it largely creates new deposits. Modern money is mostly digital promises, not paper in a vault."],
 /* -- Geography -- */
 ["geo","fact","Canada has more lakes than the rest of the world combined.","Over 60% of the planet's lakes sit in one country. The map hides just how much of Canada is water."],
 ["geo","fact","The Pacific is wider than all the land on Earth put together.","At its widest, you could line up every continent across it and still have ocean to spare. We live on a water world."],
 ["geo","fact","Mount Everest grows a few millimetres every year.","India is still crashing into Asia, pushing the Himalayas higher. The tallest mountain isn't finished being built."],
 ["geo","idea","Latitude shaped history more than we admit.","Climate, crops, and disease followed the bands of the globe. Where a civilization sat on the map quietly set its starting hand."],
 ["geo","fact","Istanbul is the only city on two continents.","Split by the Bosphorus, it stands in both Europe and Asia — a literal bridge between worlds for 2,000 years."],
 /* -- Physics (more) -- */
 ["physics","fact","If the Sun vanished, Earth would keep orbiting for 8 minutes.","Gravity travels at light speed. We'd feel the loss the same instant we saw the dark — not a second before."],
 ["physics","idea","Energy is never created or destroyed, only moved.","The food you ate, the wind outside, the light on this screen — all the same currency, endlessly changing form. Nothing is truly used up."],
 ["physics","fact","A hummingbird's wings and a galaxy obey the same laws.","The physics that spins water down a drain is the physics that spins galaxies. The rules scale from the tiny to the titanic."],
 ["physics","idea","Absolute zero can be approached but never reached.","At −273.15°C atoms would stop entirely — and quantum rules forbid perfect stillness. The universe has a floor you can't quite touch."],
 ["physics","fact","Most of an atom is empty space.","If the nucleus were a marble, the nearest electron would be a stadium away. The 'solid' world is mostly nothing, held by forces."],
 /* -- Math (more) -- */
 ["math","idea","A map of any country needs only four colours.","No matter how tangled the borders, four colours keep neighbours distinct. Proven by computer in 1976 — the first of its kind."],
 ["math","fact","Zero factorial equals one.","0! = 1, because there's exactly one way to arrange nothing. Math's edge cases are where its logic shows its teeth."],
 ["math","idea","Exponential growth breaks human intuition.","We think in straight lines; nature often doubles. That gap is why pandemics, savings, and viral posts all 'suddenly' explode."],
 ["math","fact","There are exactly as many even numbers as whole numbers.","Both are infinite, and you can pair them one-to-one. At infinity, the part can equal the whole. Cantor's mind-bender."],
 ["math","idea","Averages hide as much as they reveal.","A room's average wealth soars if a billionaire walks in — while everyone else is still broke. Always ask about the spread, not just the middle."],
 ["math","quote","In mathematics you don't understand things. You just get used to them.","John von Neumann","—"],
 /* -- History (more + timelines) -- */
 ["history","timeline","The Industrial Revolution, in four sparks.","1712 the steam engine → 1769 Watt improves it → 1825 the railway → 1870s electricity. A century that traded muscle for machine and remade daily life.","","Berlin_Wall_1961-11-20.jpg"],
 ["history","fact","The Ottoman Empire lasted over 600 years.","From 1299 to 1922, it spanned three continents. When it finally fell, it redrew the map of the modern Middle East — lines we still live with."],
 ["history","idea","History is written by the victors — so read the losers too.","Every triumphant story has a silenced one. The fullest truth usually hides in the accounts no one had reason to celebrate."],
 ["history","timeline","From wheel to web: tools that changed us.","~3500 BC the wheel → ~1440 the printing press → 1876 the telephone → 1969 the internet → 2007 the smartphone. Each shrank distance and time."],
 ["history","fact","Vikings reached America 500 years before Columbus.","Around 1000 AD, Leif Erikson landed in Newfoundland. 'Discovery' usually means 'the version that got written down and remembered'."],
 ["history","fact","Ancient Romans had concrete better than some modern kinds.","Their seawater concrete grew stronger over centuries. We lost the recipe for 1,500 years. Progress isn't always a straight line."],
 ["history","idea","Revolutions eat their own children.","France, Russia, and more: the radicals who topple the old order often turn on each other next. Tearing down is easier than building up."],
 ["history","quote","The only thing we learn from history is that we learn nothing from history.","Georg Hegel (attrib.)","—"],
 /* -- Astronomy (more) -- */
 ["astro","fact","The observable universe is 93 billion light-years across.","Yet it's only 13.8 billion years old — space itself stretched faster than light ever could. The map is bigger than the clock allows.","","Hubble_ultra_deep_field.jpg"],
 ["astro","fact","A day on the Moon lasts about a month.","The Moon rotates once per orbit, so lunar 'days' and 'nights' each run roughly two Earth weeks. Time bends with your address.","","Full_Moon_Luc_Viatour.jpg"],
 ["astro","idea","Every element heavier than iron was born in a catastrophe.","Gold, silver, uranium — forged in exploding stars and colliding neutron stars. Your ring is a fossil of ancient cosmic violence."],
 ["astro","fact","Black holes don't 'suck' — they orbit like anything else.","Swap the Sun for a black hole of equal mass and Earth's orbit wouldn't change. They're just extremely concentrated gravity, not cosmic vacuums."],
 ["astro","fact","There may be more planets than stars in our galaxy.","Most stars host worlds; some drift starless through the dark. The galaxy is less a scattering of suns than a crowd of planets."],
 ["astro","quote","We are a way for the cosmos to know itself.","Carl Sagan","Cosmos","","Pillars_of_creation_2014_HST_WFC3-UVIS_full-res_denoised.jpg"],
 /* -- Biology / Anatomy (more) -- */
 ["bio","fact","Your body runs on a battery of electricity and salt.","Every thought and heartbeat is an electrical pulse driven by sodium and potassium crossing cell walls. You are, in part, a wet circuit."],
 ["bio","idea","Life is a war against entropy, fought with food.","Everything tends toward disorder; living things spend constant energy to stay organized. To live is to swim upstream against physics."],
 ["bio","fact","Octopuses have three hearts and blue blood.","Two hearts pump to the gills, one to the body; copper-based blood carries their oxygen. Intelligence evolved down a completely alien path."],
 ["anatomy","fact","You breathe mostly through one nostril at a time.","The dominant side switches every few hours — the 'nasal cycle.' Your body quietly rotates the workload without telling you.","","1801_The_Lungs_and_Pulmonary_System.jpg"],
 ["anatomy","fact","Your body has more bacteria than stars in the Milky Way.","Tens of trillions of microbes call you home, most of them helpful. You're less an individual than a walking, cooperating ecosystem."],
 ["anatomy","fact","The strongest muscle for its size is in your jaw.","The masseter can clench with hundreds of newtons of force. Small, unassuming, and stronger than it has any right to be.","","Skeleton_diagram.svg"],
 ["anatomy","fact","Your brain feels no pain.","It has no pain receptors of its own — surgeons operate on awake patients. The organ that processes all pain can't feel its own.","","Human_brain_NIH.jpg"],
 /* -- Strategy / Military (more) -- */
 ["war","strategy","Concentrate force at the decisive point.","Napoleon's core move: be weak everywhere that doesn't matter to be overwhelming where it does. Spreading thin loses; focusing wins.","","Napoleon4.jpg"],
 ["war","strategy","Surprise multiplies strength.","Hitting where and when the enemy doesn't expect turns a small force into a decisive one. Predictability is the cheapest thing to give away.","","Israel_Defense_Forces_-_Merkava_Mark_IV_(2).jpg"],
 ["war","strategy","Morale is to the physical as three to one.","Napoleon's estimate. Belief, cohesion and will decide battles that raw numbers say should go the other way. People fight, not spreadsheets."],
 ["war","strategy","Know the ground before you need it.","Terrain, weather, and lines of supply favour whoever studied them first. Half of victory is homework done before contact.","","Hannibal_route_of_invasion-en.svg"],
 ["war","strategy","The best general wins without a battle.","Sun Tzu again: break the enemy's will, alliances, and plans so fighting becomes unnecessary. Bloodless victory is the highest art.","","Sun_Tzu.jpg"],
 ["war","quote","Amateurs talk about tactics, but professionals study logistics.","Gen. Robert H. Barrow","US Marine Corps"],
 ["war","strategy","A defended nation needs early warning most of all.","For a small state, minutes matter. Intelligence and detection buy the time to mobilize — the difference between surprise and readiness.","","Equirectangular_projection_SW.jpg"],
 /* -- Maps / Geopolitics (more) -- */
 ["maps","map","Geography is the stage every nation must perform on.","Mountains, rivers, and coastlines shape who trades, who fights, and who thrives — long before politics gets a say. Read the land to read the story.","","World_map_-_low_resolution.svg"],
 ["maps","map","Whoever controls the sea lanes controls trade.","90% of goods still move by ship. Navies and ports, not just armies, decide which economies breathe. The map of power is a map of water.","","Mercator_projection_SW.jpg"],
 ["maps","fact","A country's shape can shape its fate.","Long, narrow nations are hard to defend and unify; compact ones are easier to govern. Borders aren't just lines — they're constraints."],
 ["maps","map","Deserts, mountains and rivers make the most stubborn borders.","Where nature draws a hard line, nations tend to settle. The map's most permanent ink is written by geography, not treaties.","","Equirectangular_projection_SW.jpg"],
 ["maps","fact","Time zones are a 19th-century invention of the railways.","Before trains, every town kept its own noon. Schedules forced the world onto a shared grid of time. Technology standardized the clock.","","Cassini_Map_of_France.jpg"],
 /* -- Animals -- */
 ["animal","fact","A shrimp's heart is in its head.","Along with much of its other organs. Nature keeps reinventing the body plan — 'where things go' is far more flexible than you'd think."],
 ["animal","fact","Crows remember human faces — and hold grudges.","They can recognize and warn others about a person who wronged them, for years. Some birds run a better memory than we credit."],
 ["animal","fact","An octopus can taste with its arms.","Each sucker is covered in chemical sensors. It explores the world by touching and tasting at once — an intelligence built on a different blueprint."],
 ["animal","fact","Wombats produce cube-shaped poop.","Their intestines mould it so it won't roll off the rocks they mark. Evolution solves problems you'd never think to ask about."],
 ["animal","fact","Tardigrades can survive space, radiation, and being boiled.","These microscopic 'water bears' shrug off conditions that kill almost everything. Life is tougher, and weirder, than fragile."],
 /* -- More long stories -- */
 ["story","story","The old man and the scorpion.","A monk kept rescuing a scorpion from the river; each time it stung him. 'Why save what keeps hurting you?' asked a boy. 'It is the scorpion's nature to sting,' the monk said, 'and mine to save. Why should I abandon my nature because it will not abandon its?' Your character isn't a reaction to others — it's a choice you keep making."],
 ["story","story","Two wolves.","A grandfather tells his grandson: 'Inside every person, two wolves fight. One is anger, envy and fear. The other is joy, kindness and hope.' The boy asks, 'Which one wins?' The old man smiles: 'The one you feed.' Your daily attention is the food. Choose your thoughts like you choose your meals."],
 ["story","story","The fisherman and the businessman.","A tycoon urges a village fisherman to work harder, build a fleet, get rich. 'Then what?' asks the fisherman. 'Then you could relax, fish a little, nap in the sun, play with your kids.' The fisherman replies, 'But that is exactly what I already do.' Sometimes the finish line is right where you're standing."],
 ["story","story","The elephant and the rope.","A tiny rope held a huge circus elephant that could snap it in a heartbeat. Asked why it never tried, the trainer explained: as a baby it was tied with the same rope, and back then it truly couldn't break free. It grew up believing it still couldn't. Most cages we live in were locked long ago and never checked again."],
];

/* ===== BATCH 3: big library expansion (real facts, added by subject) ===== */
function addCards(topic,type,rows){for(const r of rows)FEED.push([topic,type,r[0],r[1]])}

addCards("astro","fact",[
 ["Mercury has the wildest temperatures in the Solar System.","With almost no atmosphere, its day side scorches past 400°C while its night side plunges below −170°C."],
 ["Venus is the hottest planet — hotter than Mercury.","A thick CO₂ atmosphere traps heat so well the surface sits around 465°C, hot enough to melt lead."],
 ["A year on Neptune lasts 165 Earth years.","It has completed just one orbit since its discovery in 1846. Out there, time crawls."],
 ["Olympus Mons on Mars is the tallest volcano known.","At ~22 km high it's nearly three times taller than Everest, with a base the size of Arizona."],
 ["Jupiter is a failed star.","It's mostly hydrogen and helium like the Sun — just 80 times too light to ignite fusion."],
 ["Space isn't completely empty.","Even the emptiest cubic metre holds a few atoms — and the whole cosmos hums with leftover heat from the Big Bang."],
 ["A comet's tail always points away from the Sun.","The solar wind blows it back, so a comet racing away actually leads with its tail."],
 ["The Sun makes up more than a million Earths by volume.","You could pour 1.3 million Earths into it and still have room to spare."],
 ["Light from the Sun is thousands of years old inside it.","Photons take up to ~100,000 years to bounce out from the core, then just 8 minutes to reach you."],
 ["There's a diamond planet out there.","55 Cancri e may be largely crystalline carbon — a world that could be part diamond."],
 ["The Moon has moonquakes.","Tidal stress and cooling crack its crust; some quakes last far longer than Earth's because it's bone-dry."],
 ["Saturn's rings are mostly ice.","Countless chunks from dust-sized to house-sized, orbiting in a band so thin it nearly vanishes edge-on."],
 ["A teaspoon of the Sun's core would be denser than gold.","Crushed by gravity, the core is ~150 times denser than water, at 15 million°C."],
 ["Most of the universe is invisible to us.","About 95% is dark matter and dark energy we can't see — only infer from how galaxies move and space expands."],
 ["Rogue planets drift through space with no star.","Billions may wander the galaxy in permanent darkness, flung out of the systems where they formed."],
 ["Betelgeuse could explode any millennium now.","This red giant is near the end of its life; when it goes supernova, it'll shine bright enough to see by day."],
 ["The edge of the Solar System is farther than you think.","Past the planets lies the Oort Cloud — a shell of comets reaching perhaps a light-year out."],
 ["A day on Mars is almost like Earth's.","24 hours 37 minutes — so close that Mars mission crews live on a slightly stretched clock."],
 ["Uranus rolls around the Sun on its side.","Tilted ~98°, likely from a giant ancient collision, so its poles take turns facing the Sun for decades."],
 ["The largest known star could swallow Saturn's orbit.","Stephenson 2-18 is so vast that light would take hours just to circle it once."],
 ["Neutron stars are the universe's strongest magnets.","A magnetar's field is trillions of times Earth's — strong enough to distort atoms from far away."],
 ["Halley's Comet returns about every 76 years.","Last seen in 1986, it swings back in 2061 — a comet you might glimpse twice in a lifetime."],
 ["The Milky Way and Andromeda are on a collision course.","In ~4.5 billion years they'll merge — but stars are so far apart that almost nothing will actually hit."],
 ["Earth is the only planet not named after a god.","Every other planet carries a Roman deity's name; 'Earth' just means the ground beneath us."],
 ["Pluto hasn't finished one orbit since its discovery.","Found in 1930, it takes 248 years to circle the Sun — it won't complete a lap until 2178."],
 ["The coldest place we know is man-made.","Labs on Earth have chilled atoms to billionths of a degree above absolute zero — colder than deep space."],
 ["Gravity from the Moon lifts the whole ocean.","Its pull raises tides twice a day — and is slowly lengthening Earth's day, minute by minute over eons."],
 ["A spoonful of the Sun's outer atmosphere is million-degree gas.","The corona is mysteriously hotter than the surface below it — a puzzle physicists still chase."],
]);

addCards("science","fact",[
 ["A cloud can weigh over a million pounds.","All that water is spread across a huge volume of light air, so it floats — until it doesn't."],
 ["Diamonds and pencil lead are the same element.","Both are pure carbon; only the atomic arrangement makes one the hardest gem and the other soft enough to write."],
 ["Water expands when it freezes — that's why ice floats.","Almost everything shrinks when solid. Water's quirk lets fish survive under a floating lid of ice."],
 ["A bolt of lightning contains enough energy to toast 100,000 slices of bread.","It's just released in a few thousandths of a second."],
 ["Sound travels about four times faster in water than in air.","Whales can 'talk' across entire ocean basins because water carries their calls so well."],
 ["Hot metal glows because heat is light you can see.","Everything radiates; heat it enough and the glow climbs from red to white."],
 ["Your phone's glass is chemically 'toughened' with ion swaps.","Larger ions are packed into the surface, squeezing it so cracks struggle to spread."],
 ["Absolute zero is the coldest anything can get.","At −273.15°C molecular motion nearly stops. You can approach it but never quite arrive."],
 ["Rust is iron slowly burning.","Same chemistry as fire — oxidation — only far slower and without the flame."],
 ["Helium can make your voice squeaky and your circuits super.","It's the only element that stays liquid near absolute zero and enables superconductors and MRI machines."],
 ["Superglue was discovered by accident — twice.","Chemists rejected it as too sticky before realizing that was the entire point."],
 ["A single gram of DNA could store all the world's data.","Nature's information density dwarfs any hard drive we've built."],
 ["Metals feel cold because they steal your heat fast.","Wood at the same temperature feels warmer — it just conducts heat away from your skin more slowly."],
 ["The sky is blue because air scatters blue light most.","At sunset the light travels farther, blue is scattered away, and the leftover reds and oranges reach your eyes."],
 ["Glass is neither quite solid nor quite liquid.","It's an 'amorphous solid' — rigid, but with the jumbled atoms of a frozen liquid."],
 ["Static shock is millions of volts — but almost no current.","Voltage sounds scary; it's the current (which is tiny here) that actually matters for danger."],
 ["Radioactivity was discovered because film kept fogging.","Becquerel's photographic plates darkened near uranium, revealing invisible rays."],
 ["The Earth's core is as hot as the Sun's surface.","About 5,400°C, kept molten by pressure and the slow decay of radioactive elements."],
 ["Fire needs three things: fuel, heat, and oxygen.","Remove any one and the flame dies — the principle behind every fire extinguisher."],
 ["A rainbow is actually a full circle.","From the ground you only see the top arc; from a plane you can catch the whole ring."],
 ["Nuclear energy comes from a tiny bit of vanished mass.","E=mc²: convert a sliver of matter to energy and you release staggering power."],
 ["Antibiotics were found because mould killed bacteria.","Fleming noticed a contaminated dish where germs wouldn't grow near the fungus — and penicillin was born."],
 ["Most of your body's atoms are hydrogen — from the Big Bang.","Some of the very atoms in you are nearly as old as the universe itself."],
 ["Vaccines teach the immune system without the disease.","A harmless preview lets your body build defences before the real threat ever arrives."],
 ["The strong nuclear force is the most powerful known.","It glues atomic nuclei together against the electric repulsion trying to blow them apart."],
 ["Catalysts speed reactions without being used up.","Your body's enzymes do this billions of times a second to keep you alive."],
]);

addCards("physics","fact",[
 ["Moving clocks really do run slow.","GPS satellites must correct for time dilation, or your maps would drift kilometres off within a day."],
 ["You weigh very slightly less on a fast-moving train.","Relativity is subtle at everyday speeds — but it's always switched on."],
 ["Light behaves as both a wave and a particle.","Fire photons one at a time and they still build an interference pattern — reality refuses to pick a lane."],
 ["Sound can't travel through space.","No air, no medium, no sound — the movies lied about those roaring explosions."],
 ["Friction is why you can walk — and why nothing lasts.","The same force that grips your shoes also wears everything down, atom by atom."],
 ["A gyroscope resists being tipped.","Spinning mass 'wants' to keep its axis, which is how bikes stay up and spacecraft hold their aim."],
 ["Pressure can turn gas into liquid.","Squeeze air hard enough and it pools like water — the trick behind lighters and refrigerators."],
 ["Every action has an equal and opposite reaction.","A rocket flies by throwing gas one way so it's pushed the other. Newton's third law in fire."],
 ["Cold is not a thing — it's the absence of heat.","You can't add cold, only remove heat. 'Chill' is really 'de-heating'."],
 ["Resonance can shatter glass or topple bridges.","Match an object's natural frequency and small pushes build into huge swings."],
 ["Electricity and magnetism are two faces of one force.","Move a magnet near a wire and current flows — the principle behind every power plant."],
 ["Quantum tunnelling lets particles pass 'solid' walls.","It sounds impossible, yet it's how the Sun shines and how flash memory works."],
 ["The faster you go, the heavier you get.","Approach light speed and your mass balloons toward infinity — which is why you can't reach it."],
 ["A feather and a hammer fall at the same rate in a vacuum.","Astronauts proved it on the Moon. Air resistance, not gravity, is what usually slows the feather."],
 ["Heat always flows from hot to cold, never the reverse — for free.","That one-way rule is the second law of thermodynamics, and it's why perpetual motion is impossible."],
 ["Lasers are just light marching perfectly in step.","Ordinary light is a crowd; laser light is a disciplined column, which is why it stays tight over huge distances."],
 ["Spinning skaters speed up by pulling their arms in.","Conservation of angular momentum — the same reason planets whirl faster when closer to the Sun."],
 ["Nothing is truly at rest.","Even 'still' atoms jiggle with heat, and you're hurtling around the Sun at 30 km per second right now."],
 ["Magnets have no isolated poles.","Cut a magnet in half and each piece grows a new north and south. No one has ever found a lone pole."],
 ["Electric current is electrons drifting slowly.","Individual electrons crawl, but the signal — the push — races down the wire near light speed."],
 ["Colour is your brain's interpretation, not a property of light.","Light has wavelengths; 'red' and 'blue' are labels your mind invents for them."],
 ["The universe is expanding, and speeding up.","Distant galaxies race away faster over time, driven by mysterious dark energy."],
]);

addCards("math","fact",[
 ["Multiply any number by 9 and the digits sum back to 9.","9×7=63, 6+3=9. A tidy quirk of our base-10 system."],
 ["A googol is 1 followed by 100 zeros.","It's more than the number of atoms in the observable universe — and Google is named after a misspelling of it."],
 ["The number 1 is not prime.","Primes have exactly two divisors; 1 has only one. Definitions matter more than they seem."],
 ["Zero took humanity thousands of years to invent.","Whole empires counted without a symbol for 'nothing.' It unlocked algebra and every computer since."],
 ["Any even number ≥ 4 seems to be the sum of two primes.","Goldbach's conjecture — checked into the quintillions, still unproven. Simple to state, brutally hard to prove."],
 ["The chance of a shuffled deck ever repeating is basically zero.","52! is so vast that your last shuffle was almost certainly the first of its kind in history."],
 ["Parallel lines can meet — on a sphere.","On a globe, 'straight' lines (great circles) always cross. Geometry depends on the surface you're on."],
 ["A Möbius strip has only one side.","Draw a line along it and you'll cover the whole thing without lifting your pen."],
 ["Imaginary numbers are entirely real in use.","The 'impossible' square root of −1 powers electronics, quantum physics and signal processing."],
 ["The Fibonacci sequence hides the golden ratio.","Divide each number by the one before it and you close in on 1.618 — nature's favourite proportion."],
 ["There are infinitely many primes.","Euclid proved it 2,300 years ago with a trick so elegant it still appears in textbooks."],
 ["0.999… exactly equals 1.","Not almost — exactly. Two different-looking labels for the very same number."],
 ["A one-in-a-million event happens often on a big enough scale.","With billions of people and moments, the astronomically unlikely becomes routine somewhere."],
 ["The house always wins because of the long run.","Each spin may be fair-ish, but a tiny edge times millions of bets guarantees the casino's profit."],
 ["You can't comb a hairy ball flat without a cowlick.","A real theorem — and the reason there's always at least one calm point in Earth's swirling winds."],
 ["Chaos means tiny changes cause huge differences.","A rounding error in a weather model can flip sun to storm — the 'butterfly effect'."],
 ["Some problems are easy to check but hard to solve.","Whether they're secretly all easy (P vs NP) is math's biggest open question — worth a million dollars."],
 ["A circle's circumference is always π times its diameter.","No matter the size — from a coin to a galaxy — that ratio never changes."],
 ["Negative times negative is positive.","Turn around twice and you face forward again — direction, doubled, cancels."],
 ["Statistics say most people have more legs than average.","A few people with fewer than two drag the average just below two, so 'most' beat it."],
 ["Encryption relies on multiplication being easy and unmixing hard.","Multiplying two huge primes is quick; factoring the result would take centuries."],
 ["The sum 1+2+3+…+100 is 5,050.","Young Gauss saw the trick: pair the ends — 1+100, 2+99 — fifty pairs of 101."],
 ["A fractal's edge can be infinitely long in a finite space.","Coastlines behave the same way — measure finer and they keep getting longer."],
 ["Probability has no memory.","A fair coin that landed heads ten times is still 50/50 next flip. The coin forgot; you didn't."],
]);

addCards("anatomy","fact",[
 ["Your small intestine is about 6 metres long.","Coiled up to fit, its inner surface is vast to soak up every nutrient from your food."],
 ["You have taste receptors in your gut, not just your tongue.","They help sense sugar and trigger hormones — your body 'tastes' food long after you swallow."],
 ["Your bones are wet, living tissue.","About a third of bone is flexible collagen; that's why it bends a little before it breaks."],
 ["Red blood cells have no nucleus.","They ditch it to carry more oxygen — and live only about four months before being recycled."],
 ["Your liver can regrow from a fraction of itself.","Remove most of it and it can rebuild — the only human organ that regenerates so dramatically."],
 ["The cornea has no blood vessels.","It gets oxygen straight from the air, which is why it must stay clear to let light through."],
 ["Your body makes about 2 million red blood cells every second.","An endless factory in your bone marrow, replacing the ones that wear out."],
 ["Fingernails and hair are made of the same protein as horns.","Keratin — the same stuff in claws, hooves and feathers across the animal kingdom."],
 ["Your ears never stop hearing, even in sleep.","The brain just filters most of it out — which is why the right sound still wakes you instantly."],
 ["Adults have fewer bones than babies.","We're born with ~300; many fuse to leave 206 by adulthood."],
 ["Your stomach gets a fresh lining every few days.","It has to, or its own acid would digest it."],
 ["The femur is stronger than concrete.","Your thigh bone can bear over a tonne of force — pound for pound, tougher than steel."],
 ["Goosebumps are a leftover from furrier ancestors.","Tiny muscles fluff hair to trap heat or look bigger — useless now, but the reflex remains."],
 ["Your brain uses about 20% of your energy.","Just 2% of your weight, yet a fifth of your fuel — thinking is metabolically expensive."],
 ["Blushing also reddens the lining of your stomach.","The same nervous response that colours your face reaches deep inside."],
 ["You lose most body heat through your skin, not just your head.","The 'head' myth comes from being the part left uncovered in the cold."],
 ["Your sense of smell can distinguish a trillion scents.","Far more than the old 'ten thousand' estimate — smell is a superpower we underrate."],
 ["Tears come in three types.","Basal (lubricating), reflex (from onions), and emotional — and emotional tears have a different chemical mix."],
 ["Your heart can keep beating outside the body — briefly.","It has its own electrical pacemaker, so it doesn't need the brain to start each beat."],
 ["Muscle 'memory' lives partly in the nerves.","Relearning a skill is faster because the pathways were carved before — the body remembers."],
 ["The largest cell in your body is the egg; the smallest, the sperm.","One is just visible to the naked eye; the other needs a microscope."],
 ["Your gut produces most of your serotonin.","The 'happy chemical' is made largely in the digestive tract, tying mood to the gut."],
 ["Skin is your largest organ.","Spread out, it covers about 2 square metres and renews itself constantly."],
 ["You share your heartbeat with your breathing.","Heart rate naturally rises on the inhale and falls on the exhale — a rhythm you can steer to calm down."],
]);

addCards("bio","fact",[
 ["A single tree can release hundreds of litres of water a day.","Trees 'sweat' through their leaves, cooling the air and seeding clouds."],
 ["Bananas are berries, but strawberries aren't.","Botanically, fruit definitions ignore how things taste — and mostly ignore common sense too."],
 ["Some bacteria can survive in boiling hot springs.","'Extremophiles' thrive where nothing should — and gave us the enzyme behind modern DNA testing."],
 ["Your cells are powered by ancient captured bacteria.","Mitochondria were once free-living microbes; two billion years ago they moved in for good."],
 ["A honeybee visits up to 1,500 flowers to make a drop of honey.","A single bee makes about a twelfth of a teaspoon in its whole life."],
 ["Mushrooms are closer to animals than to plants.","Fungi and animals share a common ancestor more recent than either shares with plants."],
 ["Seeds can sprout after thousands of years.","A date palm grew from a 2,000-year-old seed found near the Dead Sea."],
 ["Coral reefs are built by tiny living animals.","Each coral is a colony of polyps laying down limestone — cities made of biology."],
 ["Your DNA is 60% similar to a banana's.","Life shares a common toolkit; the same basic genes build wildly different creatures."],
 ["Ants can lift many times their body weight.","Scaling laws favour the small — strength doesn't grow as fast as size."],
 ["A slime mould with no brain can solve mazes.","It finds the shortest path to food, hinting that 'intelligence' can be spread out, not centralized."],
 ["Photosynthesis is the reason you can breathe.","Plants and plankton split water and release the oxygen you're using right now."],
 ["Most of life on Earth is invisible.","By sheer numbers, microbes vastly outweigh every plant and animal combined."],
 ["Trees are mostly built from thin air.","Their mass comes largely from carbon pulled out of the atmosphere, not from the soil."],
 ["A newborn kangaroo is the size of a jellybean.","It climbs to the pouch and keeps developing outside the womb."],
 ["Some fish change sex during their lives.","Clownfish and wrasses switch as their group needs — biology is more fluid than we assume."],
 ["Your body sheds and regrows its gut lining constantly.","The cells facing your food are replaced every few days — one of the fastest renewals in the body."],
 ["Viruses aren't quite alive.","They can't reproduce alone — they hijack living cells, sitting on the blurry border of life."],
 ["A blue whale's tongue can weigh as much as an elephant.","Everything about the largest animal ever is almost impossible to picture."],
 ["Grass is one of evolution's great success stories.","It survives being eaten and mown because it grows from the base, not the tip."],
]);

addCards("history","fact",[
 ["Cleopatra was Greek, not Egyptian.","She descended from Alexander's general Ptolemy — but she was the first of her line to learn Egyptian."],
 ["The Great Fire of London ended a plague.","The 1666 blaze destroyed the crowded, rat-infested slums where disease had thrived."],
 ["Napoleon wasn't unusually short.","He was average height for his day; British propaganda and a unit mix-up shrank his legend."],
 ["Ancient Egyptians invented the 365-day calendar.","Tracking the Nile's floods and the stars, they split the year much as we still do."],
 ["The shortest war in history lasted under 40 minutes.","In 1896, Zanzibar surrendered to Britain almost before the shelling finished."],
 ["Oxford was teaching before the Aztecs founded their capital.","'Old' and 'new' worlds overlap in ways textbooks rarely line up."],
 ["The printing press helped spark the Reformation.","Cheap pamphlets spread Luther's ideas faster than the Church could answer them."],

addCards("maps","map",[

addCards("war","strategy",[

addCards("phil","idea",[
 ["Plato's cave: we mistake shadows for reality.","Chained prisoners take flickering shapes on a wall for the whole world — until one steps into the sun."],
 ["Descartes doubted everything but one thing.","'I think, therefore I am' — the very act of doubting proved a doubter existed."],

 ["Camus said we must imagine Sisyphus happy.","Condemned to roll a boulder forever, he still finds meaning in the struggle itself."],
 ["The 'veil of ignorance' tests fairness.","Design society not knowing who you'll be in it, and you'll build something just."],
 ["Nietzsche warned that when you fight monsters, guard yourself.","Stare into the abyss too long and it stares back — means can corrupt ends."],

 ["The ship of Theseus questions identity itself.","Replace every plank and it may be a new ship — as your body already does with its cells."],

addCards("psych","fact",[
 ["The Dunning–Kruger effect: the less you know, the more sure you feel.","Skill includes the ability to judge your own skill — beginners often can't yet see their gaps."],

 ["The mere-exposure effect: familiarity breeds liking.","We prefer songs, faces and ideas simply because we've met them before."],

 ["The halo effect: one good trait colours all the rest.","We assume attractive or confident people are also kind or competent — often wrongly."],
 ["The endowment effect: owning something makes it feel more valuable.","People demand more to give up a mug than they'd pay to buy the same mug."],

 ["The Pygmalion effect: expectations shape performance.","Believe in someone and they tend to rise; write them off and they often sink."],
 ["The framing effect: how a choice is worded changes it.","'90% survive' and '10% die' are the same fact — and lead to different decisions."],
 ["Flow is the state where challenge meets skill.","Hard enough to absorb you, not so hard you panic — that's where hours vanish and work feels effortless."],
 ["The paradox of choice: more options can mean less happiness.","Too many possibilities breed regret and paralysis. Fewer, better choices satisfy."],
 ["Emotional contagion is real.","Moods spread through a room like a scent — you catch calm and panic from the people near you."],

 ["Delayed gratification predicts long-term success.","The kids who waited for two marshmallows tended to fare better years later — self-control compounds."],
 ["The fundamental attribution error: their fault, my circumstance.","When others fail we blame character; when we fail we blame the situation."],
 ["Habits are cued by context, not willpower.","Change the environment — the cue — and the behaviour changes far more easily than by force."],
 ["Naming an emotion loosens its grip.","'This is anxiety' shifts the brain from alarm toward reasoning. Labelling is a lever."],
 ["We fear losses about twice as much as we value gains.","That imbalance quietly steers most of the risks you take and avoid."],
]);

addCards("money","idea",[

addCards("econ","fact",[
 ["Supply and demand set most prices, quietly.","When one shifts, prices move to clear the gap — an invisible negotiation among millions."],
 ["Opportunity cost is the price of the road not taken.","Every yes is a no to the next best thing your time or money could have bought."],

addCards("discipline","idea",[

 ["Consistency beats intensity.","The person who shows up at 70% for years crushes the one who goes 100% for two weeks."],

addCards("mind","idea",[

]);

addCards("learn","idea",[

 ["Confusion is the feeling of learning.","The fog before the click is your mental model rebuilding. Don't flee it."],

 ["Test yourself before you're ready.","Failing a question first makes the answer stick far deeper when it comes."],

addCards("life","idea",[

]);

]);

addCards("health","idea",[
