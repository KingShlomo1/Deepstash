<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08080c">
<title>APEX — train your mind & body</title>
<meta name="description" content="APEX — smart-reading microlearning. Swipe bite-sized ideas, take quizzes, explore knowledge maps, tap through stories, train with timers & breathing, and follow YouTube & Instagram workout creators.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APEX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="APEX — train your mind & body">
<meta property="og:description" content="Ideas, quizzes, knowledge maps, stories & workout videos. Smart reading, TikTok-style.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#08080c">
<style>
:root{
  --ink:#08080c;--ink-2:#0d0d14;--surface:#15151f;--surface-2:#1d1d2a;--surface-3:#272736;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);
  --text:#f4f2f7;--muted:#a29fb2;--muted-2:#6c6980;
  --gold:#e8b563;--gold-2:#f3d089;--ice:#7fb0ff;--ember:#ff6a3d;--green:#37d68a;
  --grad-gold:linear-gradient(135deg,#f3d089,#e8b563 55%,#c98f3a);
  --grad-cine:linear-gradient(135deg,var(--ember),#ff2d75 45%,var(--ice));
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tab-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--text);background:radial-gradient(120% 70% at 50% -10%,#1a1526 0,transparent 55%),radial-gradient(90% 60% at 100% 110%,#141a2a 0,transparent 55%),var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
.app{position:relative;height:100dvh;height:100vh;width:min(100%,472px);margin:0 auto;background:var(--ink);overflow:hidden;box-shadow:0 0 0 1px var(--line),0 40px 120px -30px rgba(0,0,0,.9);display:flex;flex-direction:column}
@media(min-width:520px){.app{border-radius:28px;height:min(100dvh,952px);top:50%;transform:translateY(-50%)}}
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .28s,transform .28s,visibility .28s;padding-bottom:14px}
.view.active{opacity:1;visibility:visible;transform:none}
.view.nopad{overflow:hidden;padding:0}

/* music mini bar */
.musicbar{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:9px 14px;background:rgba(13,13,20,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.musicbar .mvis{display:flex;align-items:flex-end;gap:2px;width:22px;height:20px;flex:0 0 auto}
.musicbar .mvis i{flex:1;background:var(--gold);border-radius:2px;height:20%;transition:height .2s}
.musicbar.playing .mvis i{animation:eq 1s ease-in-out infinite}
.musicbar .mvis i:nth-child(2){animation-delay:.2s}.musicbar .mvis i:nth-child(3){animation-delay:.4s}.musicbar .mvis i:nth-child(4){animation-delay:.15s}
@keyframes eq{0%,100%{height:25%}50%{height:95%}}
.musicbar .minfo{flex:1;min-width:0}
.musicbar .mt{font-size:12.5px;font-weight:750}
.musicbar .ms{font-size:11px;color:var(--muted);font-weight:600}
.musicbar .mood{display:flex;gap:5px}
.musicbar .mood button{font-size:11px;font-weight:750;padding:5px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.musicbar .mood button.on{color:var(--ink);background:var(--gold);border-color:transparent}
.musicbar .mpp{width:36px;height:36px;border-radius:50%;flex:0 0 auto;border:none;background:var(--grad-gold);display:grid;place-items:center}
.musicbar .mpp svg{width:17px;height:17px;fill:#1a1206}

/* tabs */
.tabbar{height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(8,8,12,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:50;flex:0 0 auto}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted-2);position:relative}
.tab svg{width:22px;height:22px;fill:currentColor;transition:transform .2s}
.tab span{font-size:9.5px;font-weight:700;letter-spacing:.01em}
.tab.on{color:var(--text)}.tab.on svg{transform:translateY(-1px) scale(1.08);fill:url(#gg)}
.tab.on::after{content:"";position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.tab:active svg{transform:scale(.85)}

/* headers */
.top{padding:calc(env(safe-area-inset-top) + 16px) 18px 6px}
.top .h1{font-size:27px;font-weight:850;letter-spacing:-.03em}
.top .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.brandrow{display:flex;align-items:center;gap:11px}
.brandrow .mk{width:30px;height:30px;border-radius:9px;background:var(--grad-gold);display:grid;place-items:center;flex:0 0 auto;font-weight:900;color:#1a1206;font-size:15px}
.pillrow{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:800}
.pill small{color:var(--muted);font-weight:600;font-size:11px}

/* HOME */
.cine{margin:14px 18px 0;border-radius:22px;overflow:hidden;position:relative;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px}
.cine canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.cine .cov{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,8,12,.15),rgba(8,8,12,.82))}
.cine>*{position:relative;z-index:2}
.cine .eb{font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2)}
.cine .cq{font-family:var(--serif);font-size:26px;line-height:1.24;font-weight:600;margin-top:10px;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.cine .cby{font-size:13px;color:var(--muted);margin-top:10px;font-weight:600}
.cine .go{margin-top:15px;align-self:flex-start;background:var(--grad-gold);color:#1a1206;border:none;font-weight:850;font-size:14px;padding:12px 20px;border-radius:999px;display:flex;align-items:center;gap:8px}
.cine .go svg{width:15px;height:15px;fill:currentColor}
.sec{padding:22px 18px 0}
.sec h3{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h3 .more{margin-left:auto;font-size:12.5px;color:var(--gold-2);font-weight:750}
.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 18px}
.pil{border-radius:16px;padding:15px;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line)}
.pil .pe{position:absolute;top:12px;left:14px;font-size:22px}
.pil .pn{font-size:15.5px;font-weight:800}
.pil .pd{font-size:11.5px;color:var(--muted);margin-top:2px}
.hs{display:flex;gap:13px;overflow-x:auto;padding:0 18px 4px}
.acard{flex:0 0 auto;width:232px;cursor:pointer}
.acard .th{height:130px;border-radius:15px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px}
.acard .th .em{position:absolute;top:10px;right:12px;font-size:19px}
.acard .th .tp{position:relative;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(0,0,0,.4);padding:4px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.acard .rt{margin-top:9px;font-size:14.5px;font-weight:750;line-height:1.28}
.acard .rd{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .rm{margin-top:7px;font-size:11.5px;color:var(--muted-2);font-weight:700}
.fcardh{flex:0 0 auto;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.fcardh .ft{font-family:var(--serif);font-size:17px;line-height:1.3;font-weight:500}
.fcardh .fm{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2)}
.credit{text-align:center;color:var(--muted-2);font-size:12px;padding:26px 20px 30px;line-height:1.6}

/* LEARN feed */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 70px) 22px 54px;overflow:hidden;isolation:isolate}
.card .bg{position:absolute;inset:0;z-index:-2}.card .grain{position:absolute;inset:0;z-index:-1;background:radial-gradient(80% 55% at 50% 42%,transparent 40%,rgba(0,0,0,.34) 100%),linear-gradient(180deg,rgba(0,0,0,.34),transparent 22%,transparent 60%,rgba(0,0,0,.64));pointer-events:none}
.ktag{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line-2);backdrop-filter:blur(6px);margin-bottom:20px}
.ktag .dot{width:8px;height:8px;border-radius:50%}
.ctype{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-2);margin-bottom:12px}
.insight{font-family:var(--serif);font-size:clamp(24px,6.2vw,31px);line-height:1.25;font-weight:500;text-wrap:balance;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.5);max-width:22ch}
.insight.quote{font-style:italic}
.qauthor{margin-top:16px;font-size:14px;font-weight:750}.qauthor .role{color:var(--muted);font-weight:600;display:block;font-size:12.5px;margin-top:2px;font-style:normal}
.kicker{margin-top:16px;font-size:15px;line-height:1.5;color:#e9e6f2;max-width:34ch;opacity:.94;display:flex;gap:9px}
.kicker::before{content:"";flex:0 0 auto;width:3px;border-radius:3px;background:currentColor;opacity:.5}
.meta{position:absolute;left:22px;bottom:24px;right:80px;z-index:2}
.handle{font-size:14px;font-weight:750}.handle .at{color:var(--muted)}
.source{font-size:12px;color:var(--muted);margin-top:4px}
.rail-a{position:absolute;right:12px;bottom:24px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:17px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:none;color:#fff}
.act .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid var(--line);backdrop-filter:blur(6px);transition:transform .18s cubic-bezier(.3,1.4,.5,1),background .2s,color .2s}
.act .ico svg{width:22px;height:22px;fill:currentColor}
.act .n{font-size:11.5px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.act:active .ico{transform:scale(.85)}
.act.on-like{color:#ff4d6d}.act.on-like .ico{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.4)}
.act.on-save{color:var(--gold)}.act.on-save .ico{background:rgba(232,181,99,.16);border-color:rgba(232,181,99,.42)}
.act.pop .ico{animation:pop .4s}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
.hint{position:absolute;left:0;right:0;bottom:100px;z-index:5;text-align:center;color:var(--muted);font-size:13px;font-weight:600;animation:bob 1.6s ease-in-out infinite;transition:opacity .4s}
.hint svg{display:block;margin:0 auto 4px;width:22px;height:22px;fill:currentColor;opacity:.8}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* filters / lists */
.filters{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 12px}
.fchip{flex:0 0 auto;font-size:13px;font-weight:750;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:#eee9f5;white-space:nowrap}
.fchip.on{background:#fff;color:#12121a;border-color:#fff}
.rowlist{padding:0 18px}
.row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.row .rth{width:80px;height:80px;border-radius:15px;flex:0 0 auto;position:relative;display:grid;place-items:center;font-size:28px}
.row .ri{flex:1;min-width:0}
.row .ri .rtp{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2)}
.row .ri .rn{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.row .ri .rd{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.row .ri .rm{font-size:11.5px;color:var(--muted-2);margin-top:7px;font-weight:700;display:flex;gap:9px;flex-wrap:wrap}
.row .play2{width:40px;height:40px;border-radius:50%;border:none;background:var(--grad-gold);display:grid;place-items:center;flex:0 0 auto}
.row .play2 svg{width:17px;height:17px;fill:#1a1206;margin-left:2px}

/* WATCH */
.addbar{display:flex;gap:9px;padding:8px 18px 6px}
.addbar input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:14px;padding:0 14px;height:44px;outline:none}
.addbar input:focus{border-color:var(--gold)}
.addbar button{flex:0 0 auto;height:44px;padding:0 16px;border:none;border-radius:12px;background:var(--grad-gold);color:#1a1206;font-weight:850;font-size:14px}
.platseg{display:flex;gap:6px;padding:2px 18px 8px}
.platseg button{flex:1;font-size:12.5px;font-weight:800;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.platseg button.on{color:#fff;border-color:transparent;background:var(--surface-3)}
.searchchips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px}
.schip{flex:0 0 auto;font-size:12.5px;font-weight:750;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;color:#eee9f5}
.vfeed{padding:0 18px 10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:15px}
.vframe{position:relative;width:100%;background:#000;aspect-ratio:16/9}
.vframe.vert{aspect-ratio:9/16;max-height:66vh;margin:0 auto}
.vframe iframe,.vframe video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vposter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2;cursor:pointer}
.vposter .pbtn{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;backdrop-filter:blur(3px)}
.vposter .pbtn svg{width:25px;height:25px;fill:#fff;margin-left:3px}
.vposter .plat{font-size:11.5px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:999px}
.vposter .sm{font-size:12px;color:#fff;opacity:.85;max-width:80%;text-align:center}
.vmeta{padding:12px 14px;display:flex;align-items:center;gap:12px}
.vmeta .vinfo{flex:1;min-width:0}.vmeta .vttl{font-size:14.5px;font-weight:750;line-height:1.25}.vmeta .vsrc{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.vmeta .vact{display:flex;gap:6px}
.vmeta .vact button{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.vmeta .vact button svg{width:18px;height:18px;fill:currentColor}
.vmeta .vact button.on-save{color:var(--gold);border-color:rgba(232,181,99,.4);background:rgba(232,181,99,.12)}
.note{margin:2px 18px 14px;background:rgba(127,176,255,.08);border:1px solid rgba(127,176,255,.25);border-radius:14px;padding:12px 14px;font-size:12.5px;color:#cfe0ff;line-height:1.5}

/* YOU */
.prof{padding:calc(env(safe-area-inset-top) + 20px) 18px 6px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pring{position:relative;width:92px;height:92px;margin-bottom:10px}
.pring .pa{width:72px;height:72px;border-radius:50%;position:absolute;top:10px;left:10px;background:var(--grad-gold);display:grid;place-items:center;font-size:28px;color:#1a1206;font-weight:900}
.prof .pn{font-size:22px;font-weight:850}.prof .pl{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:16px 18px 4px}
.scell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 5px;text-align:center}
.scell .sv{font-size:20px;font-weight:850}.scell .sl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.iconbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:15px;align-items:center}
.iconbox canvas{width:70px;height:70px;border-radius:17px;flex:0 0 auto;box-shadow:0 10px 26px -8px rgba(232,181,99,.5)}
.iconbox .ibt{font-size:15px;font-weight:800}.iconbox .ibd{font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px}
.iconbox .dl{margin-top:9px;display:inline-flex;align-items:center;gap:6px;background:var(--grad-gold);border:none;color:#1a1206;font-weight:800;font-size:13px;padding:9px 14px;border-radius:10px}
.iconbox .dl svg{width:14px;height:14px;fill:currentColor}
.achv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ba{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center}
.ba.locked{opacity:.36}.ba .be{font-size:26px}.ba .bn{font-size:11px;font-weight:800;margin-top:6px}.ba .bd{font-size:10px;color:var(--muted);margin-top:2px}
.savewrap{padding:0 18px}
.saveitem{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;cursor:pointer}
.saveitem .st{width:5px;align-self:stretch;border-radius:4px;flex:0 0 auto}
.saveitem .sx{font-family:var(--serif);font-size:15.5px;line-height:1.3}.saveitem .stopic{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:38px 24px;font-size:14px;line-height:1.7}.empty .big{font-size:34px;margin-bottom:10px}

/* toasts / sheets / overlays */
.toasts{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(20,18,28,.95);border:1px solid var(--line-2);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px);animation:tin .3s,tout .3s 1.8s forwards;box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
.toast .xp{color:var(--gold)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.scrim{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:91;max-height:80%;display:flex;flex-direction:column;background:var(--ink-2);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);border-bottom:none;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line-2);margin:10px auto 4px}
.sheet h3{padding:6px 18px 12px;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sheet h3 .close{margin-left:auto;color:var(--muted);cursor:pointer;font-size:22px;line-height:1}
.comments{overflow-y:auto;padding:10px 16px 6px;flex:1}

 {id:"d1",topic:"discipline",emoji:"🎖️",minutes:5,author:"APEX",title:"The 40% Rule: What the SEALs Know About Your Limits",dek:"When your body begs you to quit, it's lying to you — and there's science behind why.",body:[
  ["p","There's an idea that spreads through Navy SEAL training like folklore, except it keeps proving true: when your mind is screaming that you're finished, you've actually only spent about 40% of what you have. The other 60% is guarded by a nervous system that would rather you never find out it exists."],
  ["p","Your brain is a protective pessimist. Long before your muscles truly fail, it floods you with fatigue, doubt, and the overwhelming urge to stop. This isn't weakness — it's an ancient safety margin, evolved to keep you from running yourself to death chasing an antelope. The problem is that the margin is enormous, and most people mistake its first warning for the final limit."],
  ["h","Meeting the wall"],
  ["p","David Goggins, the SEAL who turned suffering into a discipline, calls this moment 'the wall' — and his entire philosophy is built on what happens after you hit it. The wall feels like the end. It is actually the doorway. On the far side is capacity you've never touched, because you always turned back at the first knock of discomfort."],
  ["pull","The wall is not a stop sign. It's the point where the real workout — and the real person — begins."],
  ["h","Why this matters off the battlefield"],
  ["p","You don't need to be carrying a boat over your head to use this. The 40% Rule applies to the last three reps, the final hour of study, the hard conversation you keep avoiding, the business you're too tired to build. In each case, the quitting voice arrives early and loud, disguised as a verdict when it's really just a suggestion."],
  ["p","The skill is not silencing that voice — you can't. The skill is learning to hear it, nod, and take one more step anyway. Each time you do, you recalibrate. The wall moves. What felt impossible becomes your new warm-up."],
  ["h","How to train it"],
  ["p","Start absurdly small and stay honest. When you want to stop, do 10% more — one more rep, five more minutes, one more attempt. You're not trying to break yourself; you're teaching your nervous system that discomfort is survivable and that you, not your fatigue, decide when you're done. Do this for weeks and something quiet but permanent shifts: you stop believing the first flinch. And a person who no longer believes their own excuses is very hard to stop."],
 ]},
 {id:"l1",topic:"learn",emoji:"📚",minutes:5,author:"APEX",title:"How to Learn Anything Twice as Fast",dek:"Almost everything you were taught about studying is quietly wrong.",body:[
  ["p","Most people study by re-reading and highlighting. It feels productive, it's comfortable, and it barely works. Decades of research into how memory actually forms point to a handful of techniques that feel worse in the moment and work dramatically better over time. The discomfort, it turns out, is the mechanism."],
  ["h","Recall, don't review"],
  ["p","The single highest-leverage change is to stop re-reading and start testing yourself. Close the book and try to reconstruct what you just learned from memory. This is called active recall, and every act of struggling to remember physically strengthens the pathway to that memory. Re-reading lets the information stay a stranger you keep waving at; recall forces an introduction."],
  ["pull","If it feels easy, you're probably not learning. Productive study feels like effort."],
  ["h","Space it out"],
  ["p","Cramming works — until Tuesday. The same total hours, spread across days and weeks, build memory that lasts for years. The trick is to review material right as you're about to forget it; each well-timed reminder resets the forgetting clock and makes the memory more durable. Apps like spaced-repetition flashcards automate this, but even a rough schedule beats a single panicked all-nighter."],
  ["h","Explain it like they're twelve"],
  ["p","Richard Feynman's method was disarmingly simple: take the thing you want to understand and explain it, in plain words, as if to a curious child. The instant you reach for jargon or your explanation gets fuzzy, you've found the exact edge of your understanding. Go back, fill that gap, and try again. Teaching is the fastest way to expose what you only pretended to know."],
  ["h","Interleave and connect"],
  ["p","Finally, don't study one topic to death before moving on. Mixing related subjects — interleaving — feels messier but trains your brain to choose the right tool, not just apply the last one. And whenever you meet a new idea, tie it to something you already know. Memory isn't a warehouse of isolated facts; it's a web. The more threads you attach an idea to, the harder it is to lose."],
 ]},
 {id:"m1",topic:"mind",emoji:"🧘",minutes:4,author:"APEX",title:"The 5-Minute Habit That Rewires Your Brain",dek:"Meditation isn't mysticism. It's measurable training for the mind's most important muscle.",body:[
  ["p","Strip away the incense and the mysticism and meditation is something almost boringly practical: repetitions for your attention. And like any training, it changes the tissue it works on. Brain scans of regular meditators show real, physical differences — a thicker prefrontal cortex, a calmer, smaller fear center. You are, quite literally, remodeling the organ you think with."],
  ["h","The rep is the point"],
  ["p","Beginners almost always misunderstand the exercise. They think the goal is a blank, thoughtless mind, and when thoughts keep coming they conclude they're 'bad at it.' But noticing that your mind has wandered and gently bringing it back — that noticing and returning is the entire rep. A wandering mind isn't failure. It's the weight you're lifting."],
  ["pull","You'll never empty the sky of clouds. You just stop chasing each one."],
  ["h","Why it bleeds into everything"],
  ["p","Here's the quiet magic: the muscle you build sitting still is the same one you use everywhere else. The pause between a rude email and your reply. The half-second where you choose the salad or the fries. The ability to stay with a hard task instead of reaching for your phone. Meditation trains the gap between stimulus and response — and in that gap lives every good decision you'll ever make."],
  ["h","How to start tonight"],
  ["p","Sit comfortably. Set a timer for five minutes. Breathe normally and put your attention on the sensation of the breath. When you notice you've drifted into planning or worrying — and you will, constantly — simply note it and come back to the breath. That's it. No app, no lotus position, no emptying required. Five minutes a day, and within weeks you'll catch yourself pausing where you used to react. That pause is where your freedom lives."],
 ]},
 {id:"p1",topic:"phil",emoji:"🏛️",minutes:5,author:"APEX",title:"The Stoic Morning: How to Own Your Day Before It Owns You",dek:"Two thousand years ago, an emperor and a former slave built the same operating manual for a hard life.",body:[
  ["p","Stoicism gets caricatured as gritting your teeth and feeling nothing. The real thing is almost the opposite: a practical toolkit for staying calm, useful, and free in a world that mostly refuses to cooperate. Its two most famous teachers were an emperor, Marcus Aurelius, and a man born into slavery, Epictetus — and they arrived at the same core move from opposite ends of fortune."],
  ["h","The one idea everything hangs on"],
  ["p","Divide the world into two piles: what you control and what you don't. You don't control the weather, the traffic, other people's opinions, the past, or the outcome of most things you want. You do control your own judgments, your effort, your response. Almost all suffering, the Stoics argued, comes from demanding authority over the first pile. Peace comes from pouring your energy into the second."],
  ["pull","You have power over your mind — not outside events. Realize this, and you find strength."],
  ["h","The morning rehearsal"],
  ["p","Marcus began his days by honestly expecting friction: 'Today I will meet people who are ungrateful, arrogant, dishonest.' It sounds bleak; it's actually armor. When you've already rehearsed the difficulty, it can't ambush you. You meet the rude driver and the broken plan with a nod instead of a spiral, because you never expected a frictionless day in the first place."],
  ["h","Negative visualization"],
  ["p","The Stoics also practiced briefly imagining loss — the job gone, the loved one absent — not to wallow, but to wake up. We adapt to our blessings until they turn invisible; picturing their absence makes them vivid again. You walk back into your ordinary life and suddenly see how much of it you'd been taking for granted."],
  ["h","Put it to work"],
  ["p","Tomorrow, before the noise starts, take sixty seconds. Name one thing you'll face that you can't control, and release it. Name one thing you can control, and commit to it. Picture one thing you'd hate to lose, and let it make you grateful. That's the whole practice. Do it daily and you become strangely hard to rattle — not because nothing goes wrong, but because you've stopped outsourcing your peace to things that were never yours to command."],
 ]},
 {id:"g1",topic:"genius",emoji:"💡",minutes:4,author:"APEX",title:"Think Backwards: The Quiet Power of Inversion",dek:"The sharpest minds don't chase success. They engineer the absence of failure.",body:[
  ["p","The mathematician Carl Jacobi had a maxim for cracking hard problems: invert, always invert. When a question wouldn't yield head-on, he flipped it and attacked from behind. Two centuries later, the investor Charlie Munger turned that habit into a philosophy — and a fortune."],
  ["p","Inversion is simple. Instead of asking 'how do I achieve this?', ask 'what would guarantee I fail?' — then refuse to do any of it. You don't chase the win; you subtract the losses, and the win arrives by elimination."],
  ["pull","It's easier to avoid stupidity than to achieve brilliance — and the results look identical."],
  ["h","Why it beats optimism"],
  ["p","Forward thinking asks you to find the one narrow path to a good outcome. Inversion asks you to map the many wide roads to a bad one — and there are almost always more ways to fail than to succeed, which makes them easier to spot and cheaper to dodge. Want a good marriage? List what reliably destroys them — contempt, dishonesty, never listening — and simply don't. You've done most of the work without a vision board."],
  ["h","The pre-mortem"],
  ["p","Engineers formalize this as a 'pre-mortem': before a project launches, imagine it has already failed spectacularly, then work backwards to list every cause. Naming the disasters in advance is how you disarm them. Try it on anything you're stuck on — reverse the goal, stare at the failure modes, and remove them one by one. Inversion won't make you a genius. It'll do something more useful: keep you from being a fool, which over a long life is the same thing as winning."],
 ]},
 {id:"a1",topic:"phil",emoji:"🌊",minutes:5,author:"APEX",title:"You Are a River, Not a Rock",dek:"Every cell that made you a child is gone. So what, exactly, has survived?",body:[
  ["p","Around 2,500 years ago, Heraclitus said something that still won't leave people alone: you cannot step in the same river twice. The water you touched a moment ago is already downstream. The river keeps its name and shape, but its substance never stops leaving. He wasn't only talking about rivers — he was talking about you."],
  ["h","The ship that isn't there"],
  ["p","Philosophers sharpened it into a puzzle. Replace every plank of a ship, one by one, until none of the original remains. Is it the same ship? Here's what makes it personal: your body replaces roughly 330 billion cells a day. The atoms that spelled out 'you' as a seven-year-old have almost entirely dispersed. Physically, you are the ship with every plank swapped — and you did it without noticing."],
  ["pull","You are not a substance. You are a pattern — not the water, but the shape of the flow."],
  ["p","A whirlpool is a real thing you can point to and name, yet it's made of different water every instant. It exists as a process, not a possession. So do you. That reframes the guilt you carry from years ago — it belongs to a body built of atoms you no longer own. And the self you fear you're stuck being isn't a rock but a current, and currents can be redirected."],
  ["h","The freedom in it"],
  ["p","If you're a pattern rather than a thing, change isn't a betrayal of some 'true self' — it's the only way a self exists at all. The river that stopped moving wouldn't be purer. It would be a puddle. 'No man steps in the same river twice,' Heraclitus said, 'for it's not the same river, and he's not the same man.' Both of you have moved on. That's not loss. That's what being alive is."],
 ]},
 {id:"a3",topic:"money",emoji:"📈",minutes:6,author:"APEX",title:"How Money Grows While You Sleep",dek:"The most powerful force in finance isn't picking winners. It's patience, doing math.",body:[
  ["p","Ask most people how the wealthy got there and they'll describe a great trade or a lucky bet. But the quiet engine behind almost every durable fortune is far less dramatic and far more available to you: compound growth. It's arithmetic that behaves like magic, and its only real requirement is time."],
  ["h","The penny that beats the million"],
  ["p","Would you rather have a million dollars today, or a penny that doubles every day for thirty days? Almost everyone grabs the million. They're wrong. The doubling penny crosses five million by day thirty — but on day twenty it's worth about five thousand dollars, and you'd feel like a fool for waiting. The entire fortune materializes in the last five days. Compounding looks like nothing is happening right up until everything happens at once."],
  ["pull","Compounding rewards the patient and punishes the impatient with the exact same math."],
  ["h","Why boring wins"],
  ["p","This is why serious financial advice sounds almost insultingly dull: spend less than you earn, invest the difference in something broad and cheap, and leave it alone for decades. The magic isn't in the choosing — it's in the not-touching. An investor who starts at 25 and stops at 35 often beats one who invests three times as long starting at 35, purely on compounding's head start."],
  ["h","The real enemy"],
  ["p","If it's this simple, why isn't everyone rich? Because compounding demands a temperament, not an intellect. Every crash whispers the same lie — sell now, get back in later — and those who obey lock in losses and miss the recovery. The ones who do nothing, who let the penny keep doubling through the ugly years, win. The secret to money growing while you sleep is almost literal: you have to actually go to sleep, and let time do the one thing you cannot rush."],
 ]},
 {id:"a6",topic:"psych",emoji:"⏱️",minutes:5,author:"APEX",title:"You Live 80 Milliseconds in the Past",dek:"By the time you experience 'now,' it's already over. Your brain hides the delay.",body:[
  ["p","Right now feels immediate — you look up, you see the room, and it all seems to arrive the instant it happens. That seamless 'now' is one of the most convincing illusions your brain produces, because the present you're experiencing is already, unavoidably, in the past."],
  ["h","The lag you never notice"],
  ["p","Light and sound take time to arrive; your organs take time to convert them; the signals crawl up slow, wet biology. Add it up and the world you consciously perceive is roughly 80 milliseconds behind the real one. You are always watching a slightly delayed broadcast and calling it live."],
  ["pull","Consciousness isn't a live feed. It's a heavily edited replay that arrives just late enough to feel instant."],
  ["h","The stitching"],
  ["p","Different signals take different times to process — a touch on your toe travels farther than one on your nose — yet tapped together, you feel them at once. Your brain waits for the slowest signal, synchronizes everything, and presents a tidy unified moment, like an editor cutting scattered footage into one smooth scene. The 'now' you live in was assembled backstage."],
  ["h","A feature, not a bug"],
  ["p","You might expect evolution to fix this. It's the opposite. A perfectly instantaneous but unsynchronized stream of raw sensation would be useless — you'd flinch at echoes and trip over your reflexes. By buffering reality for a fraction of a second, your brain buys time to sort, align, and predict, handing your conscious mind a clean, stable world instead of chaos. So when a moment feels perfectly present, savor the craftsmanship. Someone worked hard, in the dark, a few dozen milliseconds ago, to make sure you'd never notice you were late. That someone was you."],
 ]},
];

/* ===== MUSIC ENGINE (generative, royalty-free) ===== */
const Music=(function(){
 let ctx,master,playing=false,nodes=[],timer=null,mood="focus";
 const SC={calm:{root:196,scale:[0,3,5,7,10],bpm:0,pad:.09,type:"sine",cut:700},
           focus:{root:220,scale:[0,2,4,7,9],bpm:0,pad:.07,type:"triangle",cut:900},
           epic:{root:110,scale:[0,3,7,10,12],bpm:0,pad:.11,type:"sawtooth",cut:1200}};
 function ensure(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.0;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
   // simple ambient delay for space
   const dl=ctx.createDelay();dl.delayTime.value=.38;const fb=ctx.createGain();fb.gain.value=.32;const wet=ctx.createGain();wet.gain.value=.3;master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(comp);}}
 function note(f,dur,when,gain,type,cut){const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type=type;o.frequency.value=f;lp.type="lowpass";lp.frequency.value=cut;g.gain.value=0;o.connect(lp);lp.connect(g);g.connect(master);
   g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(gain,when+dur*.35);g.gain.linearRampToValueAtTime(0,when+dur);o.start(when);o.stop(when+dur+.05);}
 function chord(){if(!playing)return;const cfg=SC[mood];const t=ctx.currentTime;const deg=cfg.scale;const base=cfg.root*Math.pow(2,Math.floor(Math.random()*2)-1);
   // pad chord (root, third-ish, fifth-ish)
   const picks=[deg[0],deg[2%deg.length],deg[4%deg.length]];
   picks.forEach((d,i)=>{const f=base*Math.pow(2,d/12);note(f,6,t,cfg.pad,cfg.type,cfg.cut);if(mood==="epic")note(f/2,6,t,cfg.pad*.7,"sine",600);});
   // occasional bell/arp
   if(mood!=="calm"&&Math.random()<.7){for(let i=0;i<3;i++){const d=deg[Math.floor(Math.random()*deg.length)]+12;note(base*Math.pow(2,d/12),1.4,t+.6+i*.5,.05,"sine",2200);}}
   timer=setTimeout(chord,mood==="epic"?5200:6200);}
 return{
  toggle(){ensure();if(ctx.state==="suspended")ctx.resume();playing=!playing;if(playing){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(.5,ctx.currentTime+1.5);chord();}else{master.gain.linearRampToValueAtTime(0,ctx.currentTime+.8);clearTimeout(timer);}return playing},
  setMood(m){mood=m;S.mood=m;save();},
  isPlaying(){return playing},
  current(){return mood}
 };
})();

function hs(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)}}

/* cinematic canvas: drifting particles/embers */
let cineRaf=null;
function startCine(cv){if(!cv)return;const x=cv.getContext("2d");let W,H,dpr,ps=[];function rs(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}rs();ps=[...Array(40)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,s:Math.random()*.4+.1,o:Math.random()}));let t=0;
 function fr(){if(!document.body.contains(cv)){cancelAnimationFrame(cineRaf);return}t++;x.clearRect(0,0,W,H);const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#3a2a12");g.addColorStop(.5,"#241a2e");g.addColorStop(1,"#101526");x.fillStyle=g;x.fillRect(0,0,W,H);
  ps.forEach(p=>{p.y-=p.s;p.x+=Math.sin((t+p.o*100)*.01)*.2;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle=`rgba(243,208,137,${.15+p.o*.35})`;x.fill()});
  cineRaf=requestAnimationFrame(fr)}cancelAnimationFrame(cineRaf);fr()}

const timerEl=$("#timer");let TT=null,ac=null;
function beep(f,d,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v||.2,ac.currentTime);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.stop(ac.currentTime+(d||.15))}catch(e){}}
function steps(w){const s=[];for(let r=0;r<w.rounds;r++)w.ex.forEach(e=>s.push({name:/rest/i.test(e[0])?"Rest":e[0],dur:e[1],cue:e[2]||"",rest:/rest/i.test(e[0]),round:r+1}));return s}

 timerEl.className="timer show "+(st.rest?"tmr-rest rest":"tmr-work work");
 timerEl.innerHTML=`<div class="tmr-top"><button id="tc" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button><div class="tt">${esc(w.title)}<small>Round ${st.round}/${TT.rounds} · ${TT.i+1}/${TT.st.length}</small></div></div>
  <div class="tmr-mid"><div class="tmr-phase">${st.rest?"Rest":"Work"}</div><div class="tmr-ring"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="112" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="10"/><circle id="arc" cx="125" cy="125" r="112" fill="none" stroke="${st.rest?'#37d68a':'#ff4d6d'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 125 125)"/></svg><div class="tmr-count" id="cnt">${Math.ceil(TT.rem)}</div></div>
   <div class="tmr-ex">${esc(st.name)}</div>${st.cue?`<div class="tmr-cue">${esc(st.cue)}</div>`:""}<div class="tmr-next">${nx?"Next · "+esc(nx.name):"Last one — finish strong!"}</div></div>
  <div class="tmr-ctrl"><button class="skip" id="tp"><svg viewBox="0 0 24 24"><path d="M7 6v12M20 6l-9 6 9 6z"/></svg></button><button class="pp" id="tpp"><svg viewBox="0 0 24 24"><path d="${TT.paused?'M8 5v14l11-7z':'M7 5h4v14H7zM13 5h4v14h-4z'}"/></svg>${TT.paused?"Resume":"Pause"}</button><button class="skip" id="tn"><svg viewBox="0 0 24 24"><path d="M17 6v12M4 6l9 6-9 6z"/></svg></button></div>`;
 $("#tc").onclick=stopTimer;$("#tpp").onclick=()=>{TT.paused=!TT.paused;TT.last=performance.now();drawTimer()};$("#tn").onclick=()=>adv(1);$("#tp").onclick=()=>adv(-1)}
function tick(){if(!TT||TT.kind!=="workout")return;TT.raf=requestAnimationFrame(tick);const now=performance.now();if(!TT.last)TT.last=now;const dt=(now-TT.last)/1000;TT.last=now;if(TT.paused)return;const prev=TT.rem;TT.rem-=dt;if(Math.ceil(prev)!==Math.ceil(TT.rem)&&TT.rem>0&&TT.rem<=3.05)beep(880,.08,.25);const st=TT.st[TT.i],cnt=$("#cnt"),arc=$("#arc");if(cnt)cnt.textContent=Math.max(0,Math.ceil(TT.rem));if(arc&&st.dur){const c=2*Math.PI*112;arc.setAttribute("stroke-dashoffset",c*(1-Math.max(0,TT.rem)/st.dur))}if(TT.rem<=0){beep(st.rest?660:520,.18,.3);adv(1)}}
function adv(d){if(!TT)return;TT.i+=d;if(TT.i>=TT.st.length)return finishW();if(TT.i<0)TT.i=0;TT.rem=TT.st[TT.i].dur;TT.last=performance.now();TT.paused=false;drawTimer()}
function finishW(){const w=TT.w;cancelAnimationFrame(TT.raf);const m=wMin(w);S.workouts++;S.minutes+=m;bump();addXP(30);beep(784,.15);setTimeout(()=>beep(1046,.2),160);save();timerEl.className="timer show";timerEl.innerHTML=`<div class="tmr-done"><div class="big">🎉</div><h2>Workout complete</h2><p>${esc(w.title)} · ${m} active min · +30 XP</p><button id="td">Done</button></div>`;$("#td").onclick=()=>{stopTimer()};TT=null}
function stopTimer(){if(TT){cancelAnimationFrame(TT.raf);if(TT.btimer)clearTimeout(TT.btimer);TT=null}timerEl.classList.remove("show");setTimeout(()=>timerEl.innerHTML="",300);if(cur==="train")renderTrain();if(cur==="home")renderHome()}

function startSession(id){const s=SESSIONS.find(x=>x.id===id);if(!s)return;timerEl.classList.add("show");
 if(s.kind==="breathe")runBreathe(s);else runMeditate(s)}
function runBreathe(s){const labels=["Inhale","Hold","Exhale","Hold"];let cycle=0,phase=0;TT={kind:"breathe"};
 timerEl.className="timer show breathe";
 timerEl.innerHTML=`<div class="tmr-top"><button id="tc"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button><div class="tt">${esc(s.title)}<small>Follow the orb · <span id="cyc">${s.cycles}</span> cycles left</small></div></div>

  <div class="tmr-ctrl"><button class="pp" id="tpp">Breathe with it</button></div>`;
 $("#tc").onclick=stopTimer;
 const orb=$("#orb"),bl=$("#bl");let running=false;
 function next(){if(!TT){return}const dur=s.pattern[phase];if(dur===0){phase=(phase+1)%4;return next()}bl.textContent=labels[phase];
  orb.style.transitionDuration=dur+"s";orb.style.transform=(phase===0)?"scale(1.35)":(phase===2)?"scale(.75)":orb.style.transform;
  if(phase===0)beep(330,.12,.12);if(phase===2)beep(247,.16,.12);
  TT.btimer=setTimeout(()=>{phase++;if(phase>3){phase=0;cycle++;const left=s.cycles-cycle;$("#cyc").textContent=Math.max(0,left);if(cycle>=s.cycles)return finishSession(s)}next()},dur*1000)}
 $("#tpp").onclick=()=>{if(running)return;running=true;$("#tpp").textContent="Breathing…";phase=0;cycle=0;next()};
}
function runMeditate(s){let rem=s.secs;TT={kind:"meditate"};timerEl.className="timer show breathe";

  <div class="tmr-mid"><div class="tmr-ring"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="112" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="10"/><circle id="arc" cx="125" cy="125" r="112" fill="none" stroke="#7fb0ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0" transform="rotate(-90 125 125)"/></svg><div class="tmr-count" id="cnt" style="font-size:56px">${mmss(rem)}</div></div><div class="tmr-cue">${esc(s.desc)}</div></div>
  <div class="tmr-ctrl"><button class="pp" id="tpp"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>Pause</button></div>`;
 $("#tc").onclick=stopTimer;let paused=false,last=performance.now();$("#tpp").onclick=()=>{paused=!paused;last=performance.now()};
 if(!Music.isPlaying()){Music.toggle();syncMusicUI()}
 function loop(){if(!TT||TT.kind!=="meditate")return;requestAnimationFrame(loop);const now=performance.now();const dt=(now-last)/1000;last=now;if(paused)return;rem-=dt;const cnt=$("#cnt"),arc=$("#arc");if(cnt)cnt.textContent=mmss(Math.max(0,rem));if(arc)arc.setAttribute("stroke-dashoffset",c*(1-rem/s.secs));if(rem<=0)finishSession(s)}

function renderYou(){const lvl=levelFor(S.xp),p=xpIn(S.xp),pct=Math.round(p.cur/p.need*100),c=2*Math.PI*33,saved=savedIds();
 const quizzesDone=Object.keys(S.quizBest).length,storiesDone=Object.keys(S.storiesSeen).length,mapsDone=Object.keys(S.mapsSeen).length,aces=Object.values(S.quizBest).filter(p=>p===100).length;
 const ach=[{e:"🌱",n:"Day one",d:"First read",g:S.reads>=1},{e:"🔥",n:"Streak x3",d:"3-day streak",g:S.streak>=3},{e:"📖",n:"Scholar",d:"Finish an article",g:Object.keys(S.done).some(k=>k[0]==="r")},{e:"🎖️",n:"Forged",d:"3 workouts",g:S.workouts>=3},{e:"🧘",n:"Still mind",d:"3 sessions",g:S.sessions>=3},{e:"🧩",n:"Quizzed",d:"Take a quiz",g:quizzesDone>=1},{e:"💯",n:"Perfect",d:"Ace a quiz",g:aces>=1},{e:"✨",n:"Storyteller",d:"Read 3 stories",g:storiesDone>=3},{e:"🗺️",n:"Cartographer",d:"Explore 3 maps",g:mapsDone>=3},{e:"💬",n:"Voice",d:"Post a reflection",g:Object.values(S.ownComments).some(a=>a.length)},{e:"🔖",n:"Curator",d:"Save 5",g:saved.length>=5},{e:"🚀",n:"Ascend",d:"Reach Lv 6",g:lvl>=6}];
 $("#v-you").innerHTML=`<div class="prof"><div class="pring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="33" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle cx="46" cy="46" r="33" fill="none" stroke="url(#gg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 46 46)"/></svg><div class="pa">A</div></div><div class="pn">You</div><div class="pl">Level ${lvl} · ${p.cur}/${p.need} XP to Level ${lvl+1}</div></div>
  <div class="statgrid"><div class="scell"><div class="sv">${S.streak}</div><div class="sl">Streak</div></div><div class="scell"><div class="sv">${S.reads}</div><div class="sl">Read</div></div><div class="scell"><div class="sv">${S.workouts+S.sessions}</div><div class="sl">Trained</div></div><div class="scell"><div class="sv">${saved.length}</div><div class="sl">Saved</div></div></div>
  <div class="sec"><h3>📱 Make it an app</h3></div>
  <div style="padding:0 18px"><div class="iconbox"><canvas id="appIcon" width="70" height="70"></canvas><div><div class="ibt">Add APEX to your Home Screen</div><div class="ibd">Download the icon, then use a Home-Screen shortcut. For a true installable, offline app with in-app video playback, ask for the hosted PWA version.</div><button class="dl" id="dlIcon"><svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Download icon</button></div></div></div>
  <div class="sec"><h3>🏅 Achievements</h3><div class="achv">${ach.map(a=>`<div class="ba ${a.g?'':'locked'}"><div class="be">${a.e}</div><div class="bn">${a.n}</div><div class="bd">${a.d}</div></div>`).join("")}</div></div>
  <div class="sec"><h3>🔖 Your stash ${saved.length?`· ${saved.length}`:''}</h3></div>
  <div class="savewrap">${saved.length?saved.slice().reverse().map(k=>{const it=itemText(k);if(!it)return"";const t=T[it.t]||T.life;return`<div class="saveitem" data-open-saved="${k}"><div class="st" style="background:${t.c}"></div><div><div class="sx">${esc(it.x)}</div><div class="stopic">${t.e} ${t.l}</div></div></div>`}).join(""):`<div class="empty"><div class="big">🔖</div>Nothing saved yet.<br>Tap Save on anything that moves you.</div>`}</div>
  <div class="credit">APEX · train your mind & body<br>Free · your data stays on your device</div>`;
 wire($("#v-you"));drawAppIcon($("#appIcon"),70);$("#dlIcon").onclick=downloadIcon;
 $("#v-you").querySelectorAll("[data-open-saved]").forEach(e=>e.onclick=()=>{const k=e.dataset.openSaved;if(k[0]==="f"){setTab("learn");scrollFeedTo(+k.slice(1))}else if(STORIES.some(s=>s.id===k)){openStories(k)}else if(MAPS.some(m=>m.id===k)){openMap(k)}else if(S.videos.some(v=>v.id===k)){setTab("watch")}else openReader(k)});
}
/* app icon */
function drawAppIcon(cv,size){if(!cv)return;const dpr=Math.min(3,devicePixelRatio||1);cv.width=size*dpr;cv.height=size*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);const r=size*.225;x.beginPath();rr(x,0,0,size,size,r);x.clip();const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,"#f3d089");g.addColorStop(.55,"#e8b563");g.addColorStop(1,"#c98f3a");x.fillStyle=g;x.fillRect(0,0,size,size);const rg=x.createRadialGradient(size*.3,size*.28,0,size*.3,size*.28,size*.8);rg.addColorStop(0,"rgba(255,255,255,.4)");rg.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=rg;x.fillRect(0,0,size,size);
 // mountain 'A' peak
 x.fillStyle="#1a1206";x.beginPath();x.moveTo(size*.5,size*.24);x.lineTo(size*.78,size*.76);x.lineTo(size*.60,size*.76);x.lineTo(size*.5,size*.55);x.lineTo(size*.40,size*.76);x.lineTo(size*.22,size*.76);x.closePath();x.fill();
 x.fillStyle="#fff";x.beginPath();x.moveTo(size*.5,size*.24);x.lineTo(size*.585,size*.40);x.lineTo(size*.5,size*.36);x.lineTo(size*.415,size*.40);x.closePath();x.fill()}
function rr(x,X,Y,W,H,r){x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function downloadIcon(){const c=document.createElement("canvas");drawAppIcon(c,1024);c.toBlob(async b=>{if(!b)return;if(window.claude&&window.claude.downloads){try{await window.claude.downloads.save({filename:"apex-icon.png",data:b});toast("✅ icon saved")}catch(e){if(e&&e.code==="declined")toast("cancelled");else fb(b)}}else fb(b)},"image/png");function fb(b){try{const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="apex-icon.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("⬇️ downloaded")}catch(e){toast("unavailable here")}}}

/* ===== STORIES viewer ===== */
const storiesEl=$("#stories");let ST={idx:0,slide:0,order:[],timer:null,paused:false};
function openStories(startId){ST.order=STORIES.map(s=>s.id);const at=ST.order.indexOf(startId);ST.idx=at<0?0:at;ST.slide=0;storiesEl.classList.add("show");drawStory()}
function drawStory(){const s=STORIES.find(x=>x.id===ST.order[ST.idx]);if(!s){return closeStories()}const t=T[s.topic]||T.life,sl=s.slides[ST.slide],saved=!!S.saves[s.id];
 storiesEl.innerHTML=`<div class="sbg" style="${grad(s.topic)}"></div><div class="sgrain"></div>
  <div class="sbars">${s.slides.map((_,i)=>`<div class="sbar ${i<ST.slide?'done':''} ${i===ST.slide?'active':''}"><i style="animation-duration:6s"></i></div>`).join("")}</div>
  <div class="stop"><div class="semoji">${s.emoji}</div><div class="stt"><b>${esc(s.title)}</b><small>${t.e} ${t.l} · APEX Stories</small></div><button class="sx" id="stX" aria-label="Close">✕</button></div>
  <div class="snav"><div class="sz" id="szPrev"></div><div class="sz" id="szNext"></div></div>
  <div class="sbody"><div class="se">${sl.e}</div><div class="sh">${esc(sl.h)}</div><div class="sp">${esc(sl.p)}</div></div>
  <div class="sfoot"><button id="stSave" class="${saved?'on-save':''}"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>${saved?'Saved':'Save'}</button><button id="stShare"><svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1C9 12 6 13 3 17c1-6 5-8 11-8z"/></svg>Share</button></div>`;
 $("#stX").onclick=closeStories;
 $("#szPrev").onclick=()=>stepStory(-1);$("#szNext").onclick=()=>stepStory(1);
 $("#stSave").onclick=e=>{e.stopPropagation();S.saves[s.id]=!S.saves[s.id];save();toast(S.saves[s.id]?"🔖 story saved":"removed");drawStory()};
 $("#stShare").onclick=e=>{e.stopPropagation();shareT(sl.h,sl.p)};
 const bar=storiesEl.querySelector(".sbar.active i");if(bar){bar.addEventListener("animationend",()=>stepStory(1),{once:true})}
 if(!S.storiesSeen[s.id]){S.storiesSeen[s.id]=true;bump();addXP(6,"✨ story · <span class=xp>+6 XP</span>");save()}
}
function stepStory(d){const s=STORIES.find(x=>x.id===ST.order[ST.idx]);if(!s)return closeStories();let n=ST.slide+d;
 if(n>=s.slides.length){if(ST.idx>=ST.order.length-1)return closeStories();ST.idx++;ST.slide=0;return drawStory()}
 if(n<0){if(ST.idx<=0){ST.slide=0;return drawStory()}ST.idx--;const p=STORIES.find(x=>x.id===ST.order[ST.idx]);ST.slide=p.slides.length-1;return drawStory()}
 ST.slide=n;drawStory()}
function closeStories(){storiesEl.classList.remove("show");setTimeout(()=>{storiesEl.innerHTML=""},260);if(cur==="home")renderHome()}

/* ===== QUIZ engine ===== */
const quizEl=$("#quiz");let QZ=null;
function openQuiz(id){const q=QUIZZES.find(x=>x.id===id);if(!q)return;QZ={q,i:0,score:0,answered:false};quizEl.classList.add("show");drawQuiz()}
function drawQuiz(){const q=QZ.q,n=QZ.i,item=q.qs[n],t=T[q.topic]||T.life,total=q.qs.length,pct=Math.round((n)/total*100);
 quizEl.innerHTML=`<div class="qtop"><button id="qX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button><div class="qbar"><i style="width:${pct}%"></i></div><span class="qn">${n+1}/${total}</span></div>
  <div class="qwrap"><div class="qcat">${t.e} ${esc(q.title)}</div><div class="qq">${esc(item.q)}</div>
   <div class="qopts" id="qopts">${item.o.map((o,i)=>`<button class="qopt" data-i="${i}"><span class="qk">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div class="qexp" id="qexp"><b>Why:</b> ${esc(item.e)}</div>
   <button class="qnext" id="qnext">${n===total-1?'See results':'Next question'}</button></div>`;
 $("#qX").onclick=closeQuiz;QZ.answered=false;
 quizEl.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i));
 $("#qnext").onclick=()=>{if(QZ.i>=total-1)return quizResult();QZ.i++;drawQuiz()};
}
function answerQuiz(choice){if(QZ.answered)return;QZ.answered=true;const item=QZ.q.qs[QZ.i],ok=choice===item.a;if(ok)QZ.score++;
 quizEl.querySelectorAll(".qopt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===item.a)b.classList.add("correct");else if(i===choice)b.classList.add("wrong");else b.classList.add("dim")});
 $("#qexp").classList.add("show");$("#qnext").classList.add("show");
 beep(ok?740:300,.12,.18);if(ok)addXP(5);
}
function quizResult(){const q=QZ.q,total=q.qs.length,pct=Math.round(QZ.score/total*100),c=2*Math.PI*66,prevBest=S.quizBest[q.id]||0,best=Math.max(prevBest,pct);
 S.quizBest[q.id]=best;S.quizzes++;bump();addXP(12);save();
 const msg=pct===100?"Flawless. You've got this cold.":pct>=75?"Strong — a couple to revisit.":pct>=50?"Decent start. Run it again to lock it in.":"Worth another pass — that's how it sticks.";
 const col=pct>=75?"var(--green)":pct>=50?"var(--gold)":"#ff6a3d";
 quizEl.innerHTML=`<div class="qtop"><button id="qX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button><div class="qbar"><i style="width:100%"></i></div><span class="qn">done</span></div>
  <div class="qresult"><div class="qring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11"/><circle cx="75" cy="75" r="66" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 75 75)"/></svg><div class="qpct"><b>${pct}%</b><small>${QZ.score}/${total}</small></div></div>
   <h2>${pct>=75?'🎉 Nailed it':pct>=50?'👏 Nice work':'💪 Keep going'}</h2><p>${esc(msg)}<br>+${12+QZ.score*5} XP earned${best>prevBest?" · new best!":""}</p>
   <div class="qbtns"><button id="qRetry">Try again</button><button class="prim" id="qDone">Done</button></div></div>`;
 $("#qX").onclick=closeQuiz;$("#qDone").onclick=closeQuiz;$("#qRetry").onclick=()=>openQuiz(q.id);
 beep(660,.14);setTimeout(()=>beep(880,.18),150);
}
function closeQuiz(){quizEl.classList.remove("show");QZ=null;setTimeout(()=>{quizEl.innerHTML=""},300);if(cur==="home")renderHome();if(cur==="you")renderYou()}

/* ===== MAP viewer ===== */
const mapEl=$("#mapview");
function openMap(id){const m=MAPS.find(x=>x.id===id);if(!m)return;const t=T[m.topic]||T.life,saved=!!S.saves[m.id];
 mapEl.innerHTML=`<div class="qtop"><button id="mX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="qbar"><i style="width:100%;background:${t.c}"></i></div><span class="qn">${t.e} map</span></div>
  <div class="mapwrap"><div class="maproot"><div class="mrbadge" style="${grad(m.topic)}">${m.emoji}</div><div class="mrt">${esc(m.root)}</div><div class="mrs">${esc(m.sub)}</div></div><div class="mstem"></div>
   ${m.branches.map((b,i)=>`<div class="mbranch" style="animation-delay:${i*.09}s"><span style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${t.c}"></span>
     <div class="mbhead"><div class="mbe" style="background:${grad(m.topic).replace('background:','')}">${b.e}</div><div class="mbl">${esc(b.l)}</div></div>
     <div class="mbpts">${b.pts.map(p=>`<div class="mbpt"><span class="mdot" style="background:${t.c}"></span>${esc(p)}</div>`).join("")}</div></div>`).join("")}
   <div class="mapfoot"><button id="mSave" class="${saved?'prim':''}"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>${saved?'Saved':'Save map'}</button><button class="prim" id="mDone">Done</button></div></div>`;
 mapEl.classList.add("show");mapEl.scrollTop=0;
 $("#mX").onclick=closeMap;$("#mDone").onclick=closeMap;
 $("#mSave").onclick=()=>{S.saves[m.id]=!S.saves[m.id];save();toast(S.saves[m.id]?"🔖 map saved":"removed");openMap(m.id)};
 if(!S.mapsSeen[m.id]){S.mapsSeen[m.id]=true;bump();addXP(8,"🗺️ map explored · <span class=xp>+8 XP</span>");save()}
}
function closeMap(){mapEl.classList.remove("show");setTimeout(()=>{mapEl.innerHTML=""},300);if(cur==="home")renderHome();if(cur==="you")renderYou()}

/* ===== SHEETS / MUSIC UI / ROUTER ===== */
function openSheet(s){$("#scrim").classList.add("show");s.classList.add("show")}
function closeSheets(){$("#scrim").classList.remove("show");cs.classList.remove("show")}
$("#scrim").onclick=closeSheets;document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);
function syncMusicUI(){const on=Music.isPlaying();$("#musicbar").classList.toggle("playing",on);$("#mPP").innerHTML=on?'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';$("#mSub").textContent=on?"Now playing · "+Music.current():"Tap play for atmosphere";$("#mMood").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.mood===Music.current()))}
$("#mPP").onclick=()=>{Music.toggle();syncMusicUI()};
$("#mMood").querySelectorAll("button").forEach(b=>b.onclick=()=>{Music.setMood(b.dataset.mood);syncMusicUI();if(Music.isPlaying())toast("🎵 "+b.dataset.mood)});
syncMusicUI();

function wire(root){
 root.querySelectorAll("[data-open-art]").forEach(e=>e.onclick=()=>openReader(e.dataset.openArt));
 root.querySelectorAll("[data-open-feed]").forEach(e=>e.onclick=()=>{setTab("learn");scrollFeedTo(+e.dataset.openFeed)});
 root.querySelectorAll("[data-goto]").forEach(e=>e.onclick=()=>setTab(e.dataset.goto));
 root.querySelectorAll("[data-open-story]").forEach(e=>e.onclick=()=>openStories(e.dataset.openStory));
 root.querySelectorAll("[data-open-quiz]").forEach(e=>e.onclick=()=>openQuiz(e.dataset.openQuiz));
 root.querySelectorAll("[data-open-map]").forEach(e=>e.onclick=()=>openMap(e.dataset.openMap));
 root.querySelectorAll("[data-start]").forEach(e=>{if(!e.classList.contains("row"))e.onclick=()=>startWorkout(e.dataset.start)});
}
let cur="home";
function setTab(name){cur=name;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===name));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$("#v-"+name).classList.add("active");
 if(name==="home")renderHome();else if(name==="learn")buildFeed();else if(name==="train")renderTrain();else if(name==="watch")renderWatch();else if(name==="you")renderYou();
 $("#v-"+name).scrollTop=name==="learn"?$("#v-"+name).scrollTop:0}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
window.addEventListener("keydown",e=>{if(e.key==="Escape"){if(storiesEl.classList.contains("show"))closeStories();else if(quizEl.classList.contains("show"))closeQuiz();else if(mapEl.classList.contains("show"))closeMap();else if(reader.classList.contains("show"))closeReader();else if(TT)stopTimer();else closeSheets()}
 if(storiesEl.classList.contains("show")){if(e.key==="ArrowRight")stepStory(1);if(e.key==="ArrowLeft")stepStory(-1)}
 if(cur==="learn"){const f=$("#feed"),h=f.clientHeight,c=Math.round(f.scrollTop/h);if(e.key==="ArrowDown"){e.preventDefault();f.scrollTo({top:(c+1)*h,behavior:"smooth"})}if(e.key==="ArrowUp"){e.preventDefault();f.scrollTo({top:Math.max(0,(c-1)*h),behavior:"smooth"})}}});

/* boot — open straight into the scrolling feed */
updateHUD();setTab("learn");

/* ===== PWA: offline + installable ===== */
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(()=>{})})}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;window.__apexInstall=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}}});
})();
</script>
